<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>أجنحة الأمل</title>
<meta name="description" content="منصة تعليمية تفاعلية لطالبات معاهد التربية الفكرية — دروس مصوّرة بالصوت، ومتابعة مشتركة بين المعلمة وولي الأمر والموجهة الصحية والمرشدة والمديرة.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F6F4EE; --card:#FFFFFF; --card2:#F1EEE6; --ink:#1E2C31; --muted:#68777E; --line:#E3DED3;
  --teal:#0F6E66; --teal2:#14877D; --teal-soft:#DDEFEC; --gold:#F0AE33; --gold-soft:#FBEEDA; --gold-ink:#9A6512;
  --rose:#E4788F; --rose-soft:#FBE3EA; --sky:#6FAAE3; --sky-soft:#E1ECF9; --lav:#A98BDD; --lav-soft:#EDE6F8;
  --ok:#2E9E5B; --ok-soft:#DDF1E6; --warn:#D9822B; --bad:#D6455D; --bad-soft:#FBE3E3;
  --shadow:0 18px 40px -22px rgba(20,50,50,.35); --r:22px; --r2:16px;
  --fs:1; --display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,sans-serif; --body:"IBM Plex Sans Arabic","Baloo Bhaijaan 2",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141C1F; --card:#1D272B; --card2:#243035; --ink:#F0F3F1; --muted:#9FB0B5; --line:#33424A;
  --teal:#3FB3A6; --teal2:#57C4B7; --teal-soft:#1C3A38; --gold:#F4BB4E; --gold-soft:#3E3320; --gold-ink:#F4D08A;
  --rose:#F08CA0; --rose-soft:#3F2830; --sky:#87BCEE; --sky-soft:#22323F; --lav:#BCA5EA; --lav-soft:#2F2840;
  --ok:#4CC27A; --ok-soft:#1F3A2C; --bad:#F06F84; --bad-soft:#3F2428; --shadow:0 18px 40px -22px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --bg:#141C1F; --card:#1D272B; --card2:#243035; --ink:#F0F3F1; --muted:#9FB0B5; --line:#33424A;
  --teal:#3FB3A6; --teal2:#57C4B7; --teal-soft:#1C3A38; --gold:#F4BB4E; --gold-soft:#3E3320; --gold-ink:#F4D08A;
  --rose:#F08CA0; --rose-soft:#3F2830; --sky:#87BCEE; --sky-soft:#22323F; --lav:#BCA5EA; --lav-soft:#2F2840;
  --ok:#4CC27A; --ok-soft:#1F3A2C; --bad:#F06F84; --bad-soft:#3F2428; --shadow:0 18px 40px -22px rgba(0,0,0,.7);
}
:root[data-contrast="high"]{ --bg:#FFFFFF; --card:#FFFFFF; --card2:#F2F2F2; --ink:#000; --muted:#333; --line:#000; --teal:#004D46; --gold:#B57A00; --gold-ink:#5A3A00; }
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:calc(17px*var(--fs));line-height:1.6;direction:rtl;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--gold);outline-offset:3px;border-radius:12px}
h1,h2,h3{font-family:var(--display);line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 110px;padding-inline:18px;min-height:100%}
.narrow{max-width:760px}
.center{text-align:center}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);border:1px solid var(--line)}
.soft{background:var(--card2);border-radius:var(--r2);padding:14px}
.muted{color:var(--muted)}
.mini{font-size:.86em}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.85em}
.pill{border-radius:999px;padding:10px 18px;font-weight:700;background:var(--card2);border:2px solid transparent;transition:transform .12s}
.pill.on{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:18px;padding:14px 22px;font-weight:800;font-family:var(--display);font-size:1.05em;min-height:56px;transition:transform .12s,box-shadow .12s;text-align:center}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--teal);color:#fff;box-shadow:0 10px 24px -12px var(--teal)}
.btn.gold{background:var(--gold);color:#3A2600}
.btn.ghost{background:var(--card2);color:var(--ink)}
.btn.line{border:2px solid var(--line);background:var(--card)}
.btn.big{font-size:1.5em;min-height:82px;padding:18px 30px;border-radius:26px;width:100%}
.btn.wide{width:100%}
.iconbtn{width:48px;height:48px;border-radius:50%;background:var(--card2);display:inline-flex;align-items:center;justify-content:center;font-size:1.2em;font-weight:800}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding:10px 0;margin-bottom:14px}
.avatar{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.track{height:16px;border-radius:999px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal),var(--ok));transition:width .6s}
.stars{display:inline-flex;gap:4px;font-size:1.4em;direction:ltr}
.stars button{padding:2px;line-height:1;filter:grayscale(1);opacity:.45;transition:transform .1s}
.stars button.on{filter:none;opacity:1}
.stars button:hover{transform:scale(1.15)}
.stars.ro button{cursor:default}
textarea,input[type=text],select{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.note{border-inline-start:5px solid var(--teal);background:var(--card2);border-radius:12px;padding:10px 14px}
.note.rose{border-color:var(--rose)} .note.gold{border-color:var(--gold)} .note.sky{border-color:var(--sky)} .note.lav{border-color:var(--lav)} .note.ok{border-color:var(--ok)}
.tile{background:var(--card);border-radius:var(--r);padding:18px;border:2px solid var(--line);text-align:center;transition:transform .14s,border-color .14s;position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:150px;justify-content:center}
.tile:hover{transform:translateY(-3px)}
.tile .ic{font-size:3em;line-height:1}
.tile .t{font-family:var(--display);font-weight:800;font-size:1.2em}
.tile.done{border-color:var(--ok)}
.tile .tick{position:absolute;top:10px;inset-inline-start:12px;background:var(--ok);color:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:900}
.opt{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:22px;font-size:1.35em;font-weight:800;font-family:var(--display);min-height:96px;display:flex;align-items:center;justify-content:center;gap:12px;text-align:center;transition:transform .1s,border-color .1s,background .1s;width:100%}
.opt:hover{border-color:var(--teal)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad);animation:shake .34s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.dots{display:flex;justify-content:center;gap:10px;margin-bottom:18px}
.dot{height:12px;width:12px;border-radius:999px;background:var(--line);transition:all .3s}
.dot.at{width:34px;background:var(--gold)} .dot.done{background:var(--ok)}
.picto{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px 10px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;transition:transform .12s,border-color .12s}
.picto:hover{border-color:var(--gold);transform:translateY(-3px)}
.picto.said{border-color:var(--teal);background:var(--teal-soft)}
.picto .ic{font-size:3.4em;line-height:1.1}
.picto .lbl{font-family:var(--display);font-weight:800;font-size:1.15em}
.picto .spk{font-size:.9em;color:var(--muted)}
.hero{position:relative;overflow:hidden;border-radius:32px;background:linear-gradient(180deg,#FDE9C4 0%,#F9D6A0 35%,#B9E1DA 70%,#7FBFB6 100%);color:#1E2C31;padding:0;box-shadow:var(--shadow)}
.hero svg{display:block;width:100%;height:auto}
.hero-text{padding:26px 22px 30px;text-align:center;background:var(--card)}
.hero-text h1{font-size:clamp(1.9em,5vw,3em);color:var(--teal)}
.hero-text .sub{font-size:clamp(1.05em,2.4vw,1.35em);margin-top:8px;color:var(--ink)}
.hero-text .tag{display:inline-block;margin-top:14px;background:var(--gold-soft);color:var(--gold-ink);border-radius:999px;padding:8px 20px;font-weight:800;font-family:var(--display)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.25em;color:var(--teal)}
.rolecard{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;transition:transform .14s,border-color .14s}
.rolecard:hover{transform:translateY(-4px);border-color:var(--teal)}
.rolecard .ic{width:74px;height:74px;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:2.2em}
.rolecard .t{font-family:var(--display);font-weight:800;font-size:1.2em}
.stu{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);background:var(--card);border:2px solid var(--line);width:100%;text-align:start;transition:transform .12s,border-color .12s}
.stu:hover{transform:translateY(-2px);border-color:var(--teal)}
.stu.on{border-color:var(--teal);background:var(--teal-soft)}
.kpi{background:var(--card);border-radius:var(--r2);padding:14px 16px;border:1px solid var(--line)}
.kpi .n{font-family:var(--display);font-size:2em;font-weight:800;color:var(--teal);font-variant-numeric:tabular-nums;line-height:1.1}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border-radius:999px;padding:10px 16px;font-weight:800;background:var(--card2);border:2px solid transparent}
.tabs button.on{background:var(--teal);color:#fff}
.feed{display:flex;flex-direction:column;gap:10px}
.msg{background:var(--card2);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.msg .who{font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bulletin{border-radius:var(--r);padding:20px;color:#1E2C31;display:flex;flex-direction:column;gap:8px;border:1px solid rgba(0,0,0,.05)}
.bulletin h3{font-size:1.25em}
.celebrate{text-align:center;padding:30px 10px}
.celebrate .big{font-size:5em;line-height:1;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-10px;width:10px;height:16px;border-radius:3px;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
.sched{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.sched div{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:1.7em;position:relative;background:var(--card2)}
.sched div.now{box-shadow:0 0 0 3px var(--gold);background:var(--gold-soft)} .sched div.done{background:var(--ok-soft)} .sched div.next{opacity:.5}
.a11y{display:flex;gap:6px;flex-wrap:wrap}
.a11y button{border-radius:12px;padding:8px 12px;background:var(--card2);font-weight:800;font-size:.9em}
.a11y button.on{background:var(--teal);color:#fff}
.speak{display:inline-flex;align-items:center;gap:6px;background:var(--teal-soft);color:var(--teal);border-radius:999px;padding:6px 14px;font-weight:800}
.hadith{background:var(--gold-soft);border:2px dashed var(--gold);border-radius:20px;padding:18px 20px;font-family:var(--display);font-size:1.3em;line-height:1.9;text-align:center;color:var(--ink)}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcard{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:16px 10px;font-weight:800;font-family:var(--display);font-size:1.05em;min-height:84px;display:flex;align-items:center;justify-content:center;text-align:center;transition:all .12s;width:100%}
.mcard.sel{border-color:var(--gold);background:var(--gold-soft)}
.mcard.paired{border-color:var(--ok);background:var(--ok-soft);opacity:.75}
.mcard.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
/* ——— محطات الرحلة ——— */
.journey{position:relative;padding:10px 0}
.journey::before{content:"";position:absolute;top:30px;bottom:30px;inset-inline-start:37px;width:6px;border-radius:3px;background:repeating-linear-gradient(180deg,var(--line) 0 10px,transparent 10px 20px)}
.station{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:start;position:relative;padding-block:10px}
.station:nth-child(even) .stcard{margin-inline-start:26px}
.ring{width:76px;height:76px;position:relative;flex:none}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:1.05em;font-variant-numeric:tabular-nums}
.ring .ic{position:absolute;inset-inline-end:-6px;bottom:-6px;background:var(--card);border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:1.1em;box-shadow:var(--shadow);border:1px solid var(--line)}
.stcard{background:var(--card);border:1px solid var(--line);border-radius:20px 6px 20px 20px;padding:14px 16px;box-shadow:var(--shadow);position:relative;transition:transform .14s}
.stcard::before{content:"";position:absolute;top:26px;inset-inline-start:-11px;border:6px solid transparent;border-inline-end-color:var(--card)}
.stcard .num{position:absolute;top:-10px;inset-inline-end:14px;background:var(--ink);color:var(--bg);border-radius:8px;padding:1px 9px;font-family:var(--display);font-weight:800;font-size:.8em}
.stcard h4{margin:0;font-family:var(--display);font-size:1.15em}
.stcard .d{color:var(--muted);font-size:.9em}
.stcard input[type=range]{width:100%;accent-color:var(--teal);margin-top:8px}
.stage{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78em;font-weight:800}
.journey.compact .station{grid-template-columns:64px 1fr}.journey.compact .ring{width:64px;height:64px}.journey.compact::before{inset-inline-start:31px}
/* ——— صندوق الملفات ——— */
.dropzone{border:3px dashed var(--teal);background:var(--teal-soft);border-radius:24px;padding:26px;text-align:center;cursor:pointer;transition:transform .12s}
.dropzone:hover{transform:scale(1.01)}
.dropzone.over{background:var(--gold-soft);border-color:var(--gold)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.file{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.file .thumb{height:120px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:3em;overflow:hidden}
.file .thumb img{width:100%;height:100%;object-fit:cover}
.file .meta{padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:.88em}
.file .meta b{word-break:break-word}
.folder{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,var(--gold-soft),var(--card));border:1px solid var(--line);border-radius:22px;padding:16px 18px}
.folder .tab{width:64px;height:54px;border-radius:10px 22px 10px 10px;background:var(--gold);position:relative;flex:none;display:flex;align-items:center;justify-content:center;font-size:1.6em}
.badgecard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.badgecard .e{font-size:2.4em;line-height:1}
.badgecard.on{border-color:var(--gold);background:var(--gold-soft)}
.approve{background:var(--ok-soft);border:2px solid var(--ok);border-radius:16px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (max-width:520px){.station:nth-child(even) .stcard{margin-inline-start:0}}
/* ——— مبادرة المحطات الصحية ——— */
.init-hero{border-radius:28px;padding:26px 22px;background:linear-gradient(135deg,var(--rose-soft),var(--card) 55%,var(--gold-soft));border:1px solid var(--line);position:relative;overflow:hidden}
.init-hero::after{content:"♥";position:absolute;inset-inline-start:-10px;bottom:-40px;font-size:11em;color:var(--rose);opacity:.08;line-height:1}
.init-hero h2{font-size:clamp(1.5em,3.6vw,2.2em);color:var(--rose)}
.init-hero .slg{display:inline-block;background:var(--card);border:2px dashed var(--rose);border-radius:999px;padding:6px 18px;font-family:var(--display);font-weight:800;margin-top:8px}
.infolist{display:grid;gap:8px}
.infolist div{display:grid;grid-template-columns:44px 150px 1fr;gap:10px;align-items:start;background:var(--card);border-radius:14px;padding:10px 12px;border:1px solid var(--line)}
.infolist .k{font-weight:800;color:var(--rose)}
.infolist .i{width:40px;height:40px;border-radius:12px;background:var(--rose-soft);display:flex;align-items:center;justify-content:center;font-size:1.3em}
.initrail{position:relative;display:grid;gap:12px}
.st-card{display:grid;grid-template-columns:92px 1fr 220px;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px;align-items:center;position:relative;overflow:hidden}
.st-card::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:8px;background:var(--st,var(--line))}
.st-card .month{text-align:center;background:var(--rose-soft);border-radius:16px;padding:8px 4px;font-family:var(--display);font-weight:800;line-height:1.2}
.st-card .month b{display:block;font-size:1.6em;color:var(--rose)}
.st-card .month span{font-size:.85em}
.st-card h4{margin:0;font-family:var(--display);font-size:1.15em}
.st-card .l{font-size:.9em;margin-top:4px}
.st-card .l b{color:var(--rose)}
.st-prog{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.st-prog input[type=range]{width:100%;accent-color:var(--rose)}
.st-prog select{padding:8px 10px;border-radius:10px}
.st-done{text-align:center;padding:8px;border-radius:14px;background:var(--ok-soft);color:var(--ok);font-weight:800}
.quote{font-family:"Baloo Bhaijaan 2",var(--display);font-size:1.5em;color:var(--rose);text-align:center;padding:10px}
@media (max-width:760px){.st-card{grid-template-columns:76px 1fr}.st-prog{grid-column:1/-1}.infolist div{grid-template-columns:40px 1fr}.infolist .k{grid-column:2}.infolist .v{grid-column:2}}
/* ——— ورود متناثرة وأضواء ——— */
#petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#lights{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#lights i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(70px);opacity:.45;animation:drift 14s ease-in-out infinite alternate;mix-blend-mode:multiply}
#lights i:nth-child(1){background:#FFD1DC;top:-15%;inset-inline-start:-10%}
#lights i:nth-child(2){background:#CDEFE9;bottom:-20%;inset-inline-end:-10%;animation-delay:-4s}
#lights i:nth-child(3){background:#FFE7B3;top:30%;inset-inline-end:20%;animation-delay:-8s;width:30vmax;height:30vmax}
#lights i:nth-child(4){background:#E3D7FF;bottom:10%;inset-inline-start:25%;animation-delay:-11s;width:28vmax;height:28vmax}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(6vw,-5vh) scale(1.15)}}
:root[data-theme="dark"] #lights i{mix-blend-mode:screen;opacity:.18}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #lights i{mix-blend-mode:screen;opacity:.18}}
.wrap{position:relative;z-index:3}

 about:["مبادرة المحطات الصحية الذكية هي مبادرة تربوية تعليمية تهدف إلى تعزيز الوعي الصحي بين طالبات المدرسة من خلال إنشاء محطات صحية ذكية تتيح لهن اكتساب مهارات حياتية ومهنية عبر أنشطة عملية وإبداعية في مجالي الصحة والوقاية والعناية بالنفس.","تأتي المبادرة إيمانًا بأهمية بناء جيل واعٍ قادر على تبنّي أنماط حياة صحية وسليمة، من خلال بيئة تعليمية محفّزة وآمنة تسهم في تنمية قدرات الطالبات وصقل مواهبهن.","كما تسعى المبادرة إلى دمج المعرفة بالتطبيق، من خلال تقديم محتوى صحي موثوق وتجارب تفاعلية وورش عمل متنوعة، بما يسهم في تعزيز الثقة بالنفس، وتنمية روح التعاون والمسؤولية لدى الطالبات.","وتعدّ المبادرة خطوة نحو تمكين الطالبات من أن يصبحن عنصرًا فاعلًا في نشر ثقافة الصحة داخل المدرسة وخارجها، من خلال إنتاج أعمال إبداعية ومشاركات مجتمعية تترك أثرًا إيجابيًا ومستدامًا."],

 closingText:["وفي ختام رحلتنا في مبادرة المحطات الصحية الذكية.. نحمد الله الذي منحنا العون والتميز لإتمام هذا العمل، والذي كان ثمرة تعاون وجهود مخلصة من طالباتنا ومعلماتنا وشركائنا في المجتمع المدرسي.","لقد شكّلت هذه المبادرة تجربة تعليمية وتوعوية فريدة، جمعت بين المعرفة والممارسة، وأسهمت في تعزيز الوعي الصحي وبناء عادات سليمة لدى طالباتنا، بطريقة مبتكرة وممتعة.","نسأل الله أن يستمر أثر هذه المحطات في حياتهن، وأن تكون بداية لمجتمع مدرسي أكثر صحة ووعيًا، مقدّمًا جيلًا واعيًا قادرًا على العناية بنفسه ومستقبله."]};

<script>
/* ====================== التخزين والمساعدات ====================== */
const KEY="ajnihat-alamal-v1";
let DB=SEED();

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}};
try{const t=localStorage.getItem(KEY+":ui");if(t){const u=JSON.parse(t);if(u.fs)document.documentElement.style.setProperty("--fs",u.fs);if(u.hc)document.documentElement.setAttribute("data-contrast","high");}}catch(e){}
const UI={fs:1,hc:false,sound:true};
try{const t=localStorage.getItem(KEY+":ui");if(t)Object.assign(UI,JSON.parse(t));}catch(e){}
const saveUI=()=>{try{localStorage.setItem(KEY+":ui",JSON.stringify(UI));}catch(e){}};
if(UI.clear)document.documentElement.setAttribute("data-clear","1");if(UI.focus)document.documentElement.setAttribute("data-focus","1");

const today=()=>new Date().toLocaleDateString("ar-SA-u-nu-arab",{year:"numeric",month:"numeric",day:"numeric"});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const stu=id=>STUDENTS.find(s=>s.id==id);
const lessonOf=id=>LESSONS.find(l=>l.id===id);
const maxScore=l=>l.mcq.length+l.tf.length+l.match.length;
const progressOf=sid=>{const done=DB.lessons[sid]||{};let got=0,tot=0;LESSONS.forEach(l=>{tot+=maxScore(l);got+=done[l.id]?done[l.id].score:0;});return Math.round(got/tot*100);};
const lessonsDone=sid=>Object.keys(DB.lessons[sid]||{}).length;

let voices=[];const loadVoices=()=>{try{voices=speechSynthesis.getVoices();}catch(e){}};
try{loadVoices();speechSynthesis.onvoiceschanged=()=>{loadVoices();if(["landing","role"].includes(S.screen))render();};}catch(e){}
const arVoices=()=>voices.filter(v=>/^ar/i.test(v.lang)||/arab|عرب/i.test(v.name));
const voiceScore=v=>{const n=(v.name||"").toLowerCase();let s=0;if(/natural|neural|online|premium|enhanced|wavenet/.test(n))s+=40;if(/google/.test(n))s+=30;if(/microsoft/.test(n))s+=25;if(/zariyah|salma|amina|hoda|laila|layla|hala|noura|aisha|زارية|سلمى|أمينة|هدى|ليلى|نورا|female|أنثى/.test(n))s+=20;if(/hamed|naayf|omar|ali|male/.test(n))s-=5;if(/ar[-_]sa/i.test(v.lang))s+=15;if(v.localService===false)s+=5;return s;};
const bestVoice=()=>{const list=arVoices();if(!list.length)return null;if(UI.voice){const f=list.find(v=>v.name===UI.voice);if(f)return f;}return list.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0];};
const normSpeech=t=>String(t).replace(/ﷺ/g," صلى الله عليه وسلم ").replace(/﴿|﴾|«|»|"/g," ").replace(/٪|%/g," بالمئة ").replace(/\.\.+/g,"، ").replace(/[—–]/g,"، ").replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}\u{20E3}]/gu," ").replace(/\s+/g," ").trim();
const speak=(t,{rate=.8}={})=>{if(!UI.sound)return;try{speechSynthesis.cancel();const txt=normSpeech(t);if(!txt)return;const parts=txt.split(/(?<=[.؟!،:])\s+/).filter(Boolean);parts.forEach((pt,i)=>{const u=new SpeechSynthesisUtterance(pt);u.lang="ar-SA";u.rate=rate;u.pitch=1.05;u.volume=1;const v=bestVoice();if(v)u.voice=v;speechSynthesis.speak(u);});}catch(e){}};
let actx=null;
const tone=(kind="ok")=>{if(!UI.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const c=actx;const seq=kind==="ok"?[659,784,988]:kind==="win"?[523,659,784,1047]:kind==="tap"?[740]:[220,180];
 seq.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type=kind==="bad"?"triangle":"sine";o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=c.currentTime+i*.09;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.45);o.start(t);o.stop(t+.5);});}catch(e){}};
const confetti=()=>{if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const box=document.createElement("div");box.className="confetti";const cols=["#F0AE33","#0F6E66","#E4788F","#6FAAE3","#A98BDD","#2E9E5B"];for(let i=0;i<60;i++){const s=document.createElement("i");s.style.left=Math.random()*100+"%";s.style.background=cols[i%cols.length];s.style.animationDelay=(Math.random()*.6)+"s";s.style.transform=`rotate(${Math.random()*360}deg)`;box.appendChild(s);}document.body.appendChild(box);setTimeout(()=>box.remove(),2600);};
let toastT;const toast=t=>{const el=document.getElementById("toast");el.innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>el.innerHTML="",2200);};

/* ====================== الورود المتناثرة ====================== */
const Petals=(()=>{const cv=document.getElementById("petals");const ctx=cv.getContext("2d");let ps=[],raf=null,on=false,dpr=1;const EM=["🌸","🌷","🌹","💮","🌺","✨"];
 const fit=()=>{dpr=Math.min(2,window.devicePixelRatio||1);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;};
 const mk=(y)=>({x:Math.random()*innerWidth,y:y??-40,vy:.6+Math.random()*1.1,vx:(Math.random()-.5)*.5,r:Math.random()*Math.PI*2,vr:(Math.random()-.5)*.03,s:18+Math.random()*20,e:EM[Math.floor(Math.random()*EM.length)],sw:Math.random()*Math.PI*2,a:.55+Math.random()*.45});
 const tick=()=>{ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);ps.forEach(p=>{p.sw+=.02;p.x+=p.vx+Math.sin(p.sw)*.6;p.y+=p.vy;p.r+=p.vr;if(p.y>innerHeight+40){Object.assign(p,mk(-40));}ctx.save();ctx.globalAlpha=p.a;ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.font=p.s+"px serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(p.e,0,0);ctx.restore();});raf=requestAnimationFrame(tick);};
 const start=(n=28)=>{if(matchMedia("(prefers-reduced-motion: reduce)").matches||UI.focus)return;fit();if(!on){ps=Array.from({length:n},()=>mk(Math.random()*innerHeight));on=true;tick();}};
 const stop=()=>{on=false;if(raf)cancelAnimationFrame(raf);raf=null;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);ps=[];};
 const shower=(x,y,n=14)=>{if(!on)return;for(let i=0;i<n;i++){const p=mk(y);p.x=x+(Math.random()-.5)*160;p.vy=1.2+Math.random()*2;p.s=22+Math.random()*18;ps.push(p);}setTimeout(()=>{ps.splice(28);},2500);};
 addEventListener("resize",fit);return {start,stop,shower};})();
const chime=()=>{if(!UI.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const c=actx;[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=c.currentTime+i*.14;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+1.4);o.start(t);o.stop(t+1.45);});}catch(e){}};
let welcomed=false;const welcome=()=>{if(welcomed)return;welcomed=true;chime();setTimeout(()=>speak("أهلًا وسهلًا بكنّ في أجنحة الأمل. قدراتٌ مختلفة، وأحلامٌ بلا حدود"),500);Petals.shower(innerWidth/2,-20,30);};
document.addEventListener("pointerdown",()=>{if(S.screen==="landing")welcome();},{once:false});
const lastHi={};const greetStudent=(id,el)=>{const s=stu(id);const now=Date.now();if(lastHi[id]&&now-lastHi[id]<2500)return;lastHi[id]=now;speak(`أهلًا وسهلًا بكِ يا ${s.short}، اشتقنا إليكِ`);tone("tap");const r=el.getBoundingClientRect();Petals.shower(r.left+r.width/2,r.top,16);burst&&typeof burst==="function"&&burst(el);};

/* ====================== أدوات ذوي الإعاقة الفكرية ====================== */
const dayKey=()=>new Date().toISOString().slice(0,10);
const nowH=()=>{const d=new Date();return d.getHours()+d.getMinutes()/60;};
const scheduleNow=()=>{const h=nowH();let idx=-1;DAY_SCHEDULE.forEach((x,i)=>{if(h>=x.h)idx=i;});return idx;};
const DaySchedule=()=>{const now=scheduleNow();return `<div class="card" style="padding:12px 14px;margin-bottom:14px;overflow:visible"><div class="row between"><b>📅 يومي اليوم <button class="speak" data-act="say" data-say="هذا جدولُ يومي. المسي الصورة لتسمعي">🔊</button></b><span class="muted mini">المسي كل صورة لتسمعيها</span></div>
 <div class="dayrail" style="margin-top:10px">${DAY_SCHEDULE.map((x,i)=>`<button class="${i<now?"past":i===now?"now":""}" data-act="say" data-say="${i<now?"انتهى: ":i===now?"الآن: ":"بعد ذلك: "}${x.t}">${i===now?`<span class="nowlbl">أنا هنا الآن 👇</span>`:""}<span class="e">${x.e}</span>${x.t}${i<now?"<span style='color:var(--ok)'>✓</span>":""}</button>`).join("")}</div></div>`;};
/* ركن الهدوء */
let calmT=null,calmOsc=null;
const calmOpen=()=>{const ov=document.createElement("div");ov.className="calm";ov.id="calm";ov.innerHTML=`<h2>ركن الهدوء 🕊️</h2><p style="font-size:1.2em;opacity:.85">تنفّسي معي… شهيق ٤ ثوانٍ، زفير ٤ ثوانٍ</p><div class="breath" id="breath">شهيق</div><p id="calmcount" style="font-size:1.3em;font-family:var(--display)">٤</p><div class="row" style="justify-content:center"><button class="btn ghost" data-act="say" data-say="أنا هادئة. أتنفّس بعمق. كل شيء بخير.">🔊 «أنا هادئة»</button><button class="btn ghost" data-act="say" data-say="${esc(LESSONS[0].intro)}">📖 عن سورة الغاشية</button></div><button class="btn gold big" data-act="calmclose" style="max-width:360px">أنا أفضل الآن 😊</button>`;document.body.appendChild(ov);
 let ph=0,cnt=4;const b=ov.querySelector("#breath"),c=ov.querySelector("#calmcount");speak("خذي نفسًا عميقًا. شهيق");
 calmT=setInterval(()=>{cnt--;if(cnt<=0){cnt=4;ph=1-ph;b.textContent=ph?"زفير":"شهيق";if(UI.sound)speak(ph?"زفير":"شهيق",{rate:.7});}c.textContent=["٠","١","٢","٣","٤"][cnt]||cnt;},1000);
 try{if(UI.sound){actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=174;o.connect(g);g.connect(actx.destination);g.gain.value=.05;o.start();calmOsc={o,g};}}catch(e){}
 if(S.me){push(DB.calm,S.me.id,{d:today(),h:new Date().getHours()});}};
const calmClose=()=>{clearInterval(calmT);try{calmOsc&&calmOsc.g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.6);setTimeout(()=>calmOsc&&calmOsc.o.stop(),700);}catch(e){}calmOsc=null;const el=document.getElementById("calm");if(el)el.remove();speak("أحسنتِ. أنتِ هادئة الآن");tone("ok");};
/* المسح التلقائي */
let scanT=null,scanI=-1,scanEls=[];
const scanStop=()=>{clearInterval(scanT);scanT=null;scanEls.forEach(e=>e.classList.remove("scan-hi"));scanEls=[];scanI=-1;};
const scanStart=()=>{scanStop();if(!UI.scan||!S.me)return;scanEls=[...document.querySelectorAll("#app [data-act]:not(.iconbtn):not(.speak):not(.a11y button):not(.dayrail button)")].filter(e=>!e.disabled&&e.offsetParent);if(!scanEls.length)return;const step=()=>{scanEls.forEach(e=>e.classList.remove("scan-hi"));scanI=(scanI+1)%scanEls.length;const el=scanEls[scanI];el.classList.add("scan-hi");el.scrollIntoView({block:"nearest",behavior:"smooth"});const lbl=(el.dataset.say||el.textContent||"").trim().slice(0,40);if(UI.sound)speak(lbl,{rate:1});};step();scanT=setInterval(step,UI.scanMs||2500);};
const scanSelect=()=>{if(!scanT||scanI<0)return false;const el=scanEls[scanI];tone("tap");el.click();return true;};
document.addEventListener("keydown",e=>{if(UI.scan&&(e.code==="Space"||e.code==="Enter")&&!e.target.matches("input,textarea,select")){if(scanSelect())e.preventDefault();}});

/* إزالة التشكيل */
const stripTashkeel=root=>{const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(/[\u064B-\u0652\u0670]/.test(n.nodeValue))n.nodeValue=n.nodeValue.replace(/[\u064B-\u0652\u0670]/g,"");}};

const rewardOf=sid=>{const r=DB.reward[sid];if(r&&r.date===dayKey())return r;return null;};

const RewardBar=(sid)=>{const r=rewardOf(sid);if(!r)return "";const n=dayStarsOf(sid),got=n>=REWARD_TARGET;return `<div class="card" style="padding:12px 14px;margin-bottom:14px;background:${got?"var(--ok-soft)":"var(--card)"}"><div class="row between"><b>🎁 مكافأتي اليوم: ${r.e} ${r.t} <button class="speak" data-act="say" data-say="مكافأتكِ اليوم ${r.t}. جمعتِ ${n} من ${REWARD_TARGET} نجوم">🔊</button></b>${got?`<span class="badge" style="background:var(--ok);color:#fff">🎉 حصلتِ عليها!</span>`:`<span class="muted mini">${n} من ${REWARD_TARGET} ⭐</span>`}</div>

const readerOpen=(sentences,title)=>{readerQ=sentences.map(normSpeech).filter(Boolean);readerI=0;const ov=document.createElement("div");ov.className="reader";ov.id="reader";ov.innerHTML=`<div class="row between"><b style="font-family:var(--display);font-size:1.3em">📖 ${esc(title)}</b><button class="iconbtn" data-act="readerclose">✕</button></div><div class="txt" id="rtxt">${readerQ.map((t,i)=>`<span id="rs-${i}">${esc(t)}</span>`).join("")}</div><div class="row" style="justify-content:center"><button class="btn ghost" data-act="readerprev">◀ السابقة</button><button class="btn gold" data-act="readerrepeat">🔁 أعيدي</button><button class="btn line" data-act="readerslow">🐢 أبطأ</button><button class="btn primary" data-act="readernext">التالية ▶</button></div>`;document.body.appendChild(ov);readerSay();};
const readerSay=()=>{if(!document.getElementById("reader"))return;document.querySelectorAll("#rtxt span").forEach(x=>x.classList.remove("on"));const el=document.getElementById("rs-"+readerI);if(!el)return;el.classList.add("on");el.scrollIntoView({block:"center",behavior:"smooth"});try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(readerQ[readerI]);u.lang="ar-SA";u.rate=readerRate;u.pitch=1.05;const v=bestVoice();if(v)u.voice=v;u.onend=()=>{if(document.getElementById("reader")&&readerI<readerQ.length-1){readerI++;setTimeout(readerSay,700);}};if(UI.sound)speechSynthesis.speak(u);}catch(e){}};

 <div class="grid g3" style="margin-top:14px">${LESSONS.map(l=>{const d=done[l.id];return `<button class="tile ${d?"done":""}" data-act="lesson" data-v="${l.id}" style="border-color:${d?"var(--ok)":l.accent};background:${d?"var(--card)":l.soft}">${d?`<span class="tick">✓</span>`:""}<span class="badge" style="position:absolute;top:10px;inset-inline-end:12px">${l.n}</span><span class="ic">${l.icon}</span><span class="t">${l.title}</span>${d?`<span class="mini muted">${d.score}/${d.max} ⭐</span>`:""}</button>`;}).join("")}</div>
 ${CraftHub(me)}
 <h2 style="font-size:1.4em;margin:26px 0 10px">أنشطتي 🌼</h2>
 <div class="grid g3">
  <button class="tile" data-act="go" data-v="activity" style="background:var(--teal-soft)"><span class="ic">🪥</span><span class="t">روتيني اليومي</span></button>
  <button class="tile" data-act="go" data-v="skills" style="background:var(--sky-soft)"><span class="ic">🎬</span><span class="t">أتعلّم بالصور</span></button>
  <button class="tile" data-act="go" data-v="comm" style="background:var(--rose-soft)"><span class="ic">🗣️</span><span class="t">أريد أن أقول</span></button>
  <button class="tile" data-act="go" data-v="mystars" style="background:var(--gold-soft)"><span class="ic">🏆</span><span class="t">نجومي</span></button>
  <button class="tile" data-act="go" data-v="journey" style="background:var(--lav-soft)"><span class="ic">🛤️</span><span class="t">رحلتي</span></button>
 </div></div>`;};

 ${Journey(me.id,{mode:"student"})}
 <div class="grid g3" style="margin-top:14px">${(DB.activities[me.id]||[]).map(a=>`<div class="badgecard on"><span class="e">${a.badge.split(" ")[0]}</span><b>${esc(a.badge.slice(a.badge.indexOf(" ")+1))}</b><span class="mini muted">${esc(a.t)}</span></div>`).join("")}</div></div>`;};

V.reward=()=>`<div class="fade narrow" style="margin:auto">${Top(`<button class="iconbtn" data-act="go" data-v="hub">✕</button>`,`<div class="row">${Avatar(S.me,48)}<b style="font-size:1.3em">${S.me.short}</b></div>`)}
 <h2 class="center" style="font-size:1.9em">اختاري مكافأتكِ لليوم 🎁 <button class="speak" data-act="say" data-say="اختاري مكافأتكِ لليوم. اجمعي ${REWARD_TARGET} نجوم لتحصلي عليها">🔊</button></h2><p class="center muted" style="margin-bottom:20px">اجمعي ${REWARD_TARGET} نجوم ⭐ وستكونُ لكِ</p>
 <div class="grid g3">${REWARDS.map((r,i)=>`<button class="tile" data-act="pickreward" data-v="${i}" style="min-height:160px;background:var(--gold-soft)"><span class="ic" style="font-size:3.6em">${r.e}</span><span class="t">${r.t}</span></button>`).join("")}</div>
 <div class="center" style="margin-top:14px"><button class="btn ghost" data-act="go" data-v="hub">لاحقًا</button></div></div>`;
V.skills=()=>`<div class="fade">${Top(`<button class="iconbtn" data-act="go" data-v="hub">✕</button>`,`<b style="font-size:1.3em">أتعلّم بالصور 🎬</b>`)}
 <p class="center muted" style="margin-bottom:14px">اختاري المهارة، وشاهدي خطواتها صورةً صورة، ثم صوّري نفسكِ وأنتِ تفعلينها</p>
 <div class="grid g2">${ACTIVITIES.map((a,i)=>`<button class="tile" data-act="skill" data-v="${i}" style="min-height:170px;background:var(--sky-soft)"><span class="ic" style="font-size:3.6em">${a.emoji}</span><span class="t">${a.title}</span><span class="mini muted">${SKILL_STEPS[a.id].length} خطوات</span></button>`).join("")}</div></div>`;
V.skill=()=>{const a=ACTIVITIES[S.idx];return `<div class="fade narrow" style="margin:auto">${Top(`<button class="iconbtn" data-act="go" data-v="skills">✕</button>`,`<b style="font-size:1.3em">${a.emoji} ${a.title}</b>`)}
 ${S.sk==="photo"?`<div class="card center"><div style="font-size:4em">📸</div><h2 style="font-size:1.7em">صوّري نفسكِ وأنتِ ${a.title==="غسل الأسنان"?"تغسلين أسنانكِ":a.title==="غسل اليدين"?"تغسلين يديكِ":a.title==="ترتيب السرير"?"ترتّبين سريركِ":"تطوين ملابسكِ"}</h2><p class="muted">ستُحفظ الصورة في ملفكِ لتراها معلمتكِ وأسرتكِ</p>
  <div class="row" style="justify-content:center;margin-top:14px"><label class="btn primary big" style="cursor:pointer;max-width:340px">📷 افتحي الكاميرا<input type="file" accept="image/*" capture="user" hidden data-skillphoto="${a.id}"></label></div>
  <div class="row" style="justify-content:center;margin-top:10px"><button class="btn ghost" data-act="go" data-v="skills">تخطّي</button></div></div>`:SkillTrain()}</div>`;};
/* ——— الدرس ——— */
const LessonTop=(l)=>Top(`<span class="badge" style="background:var(--gold-soft);color:var(--gold-ink)">⭐ ${DB.stars[S.me.id]||0}</span><button class="iconbtn" data-act="go" data-v="hub" aria-label="رجوع للقائمة">✕</button>`,`<div class="row"><span style="font-size:1.8em">${l.icon}</span><b style="font-size:1.2em">${l.title}</b></div>`);
const steps=["read","explore","mcq","tf","match"];
V.lesson=()=>{const l=S.lesson;const si=steps.indexOf(S.step);let body="";
 if(S.step==="read"){body=`<div class="card center" style="border-color:${l.accent}"><div style="font-size:4.5em;line-height:1">${l.icon}</div><h2 style="font-size:2em;margin:8px 0">${l.title}</h2>
  <div class="row" style="justify-content:center;margin-bottom:14px">${l.facts.map(f=>`<span class="badge" style="font-size:1em">${f.e} ${f.t}</span>`).join("")}</div>
  <p style="font-size:1.25em;max-width:60ch;margin:auto">${l.intro}</p>
  <div style="margin:16px auto 0;max-width:60ch" class="hadith">${l.hadith}</div>
  <div class="row" style="justify-content:center;margin-top:16px"><button class="btn gold" data-act="say" data-say="${esc(l.intro)}">🔊 اسمعي الدرس</button><button class="btn line" data-act="say" data-say="${esc(l.hadith)}">🔊 اسمعي النص</button><button class="btn line" data-act="reader">📖 اقرئي لي جملةً جملة</button></div>
  <div style="margin-top:22px"><button class="btn primary big" data-act="step" data-v="explore">التالي: الصور والإشارات ▶</button></div></div>`;}
 else if(S.step==="explore"){body=`<h2 class="center" style="font-size:1.6em">المسي الصورة لتسمعي 👆🔊</h2><p class="center muted" style="margin-bottom:16px">تعرّفي على كلماتِ الدرس بالصور والإشارات — ${S.said.size} من ${l.pictos.length}</p>
  <div class="grid g3">${l.pictos.map((p,i)=>`<button class="picto ${S.said.has(i)?"said":""}" data-act="picto" data-v="${i}"><span class="ic">${p.e}</span><span class="lbl">${p.t}</span><span class="spk">${S.said.has(i)?"✓ سمعتِها":"🔊 المسي"}</span></button>`).join("")}</div>
  <div style="margin-top:22px;max-width:520px;margin-inline:auto"><button class="btn primary big" data-act="step" data-v="mcq" ${S.said.size<Math.min(3,l.pictos.length)?"disabled style='opacity:.5'":""}>${S.said.size<3?"المسي ثلاث صور على الأقل":"جاهزة للأسئلة ▶"}</button></div>`;}
 else if(S.step==="mcq"){const q=l.mcq[S.qi];body=`${Dots(l.mcq.length,S.qi)}<div class="card center" style="border-color:${l.accent}"><span class="badge">سؤال ${S.qi+1} من ${l.mcq.length}</span><h2 style="font-size:1.8em;margin:12px 0">${q.q} <button class="speak" data-act="say" data-say="${esc(q.q)}">🔊</button></h2>
  <div class="grid g2" style="margin-top:14px">${S.order.map(i=>{const o=q.opts[i];return `<button class="opt ${S.wrong===i?"bad":""}" data-act="mcq" data-v="${i}"><span style="font-size:1.6em">${o.e||""}</span>${o.t}</button>`;}).join("")}</div></div>`;}
 else if(S.step==="tf"){const t=l.tf[S.ti];body=`${Dots(l.tf.length,S.ti)}<div class="card center" style="border-color:${l.accent}"><span class="badge">صحيح أم خطأ؟ ${S.ti+1} من ${l.tf.length}</span><h2 style="font-size:1.6em;margin:14px 0;line-height:1.7">${t.s} <button class="speak" data-act="say" data-say="${esc(t.s)}">🔊</button></h2>
  <div class="grid g2"><button class="opt ${S.wrong==="y"?"bad":""}" data-act="tf" data-v="1" style="border-color:var(--ok)"><span style="font-size:1.8em">✅</span> صحيح</button><button class="opt ${S.wrong==="n"?"bad":""}" data-act="tf" data-v="0" style="border-color:var(--bad)"><span style="font-size:1.8em">❌</span> خطأ</button></div></div>`;}
 else if(S.step==="match"){const L=l.match.map(p=>p[0]),R=S.order.map(i=>l.match[i][1]);body=`<h2 class="center" style="font-size:1.6em">صِلي كل عبارةٍ بما يناسبها 🔗</h2><p class="center muted" style="margin-bottom:14px">المسي عبارةً من اليمين ثم ما يناسبها من اليسار — ${S.pairs.length} من ${l.match.length}</p>
  <div class="matchgrid"><div class="grid">${L.map((t,i)=>`<button class="mcard ${S.pairs.includes(i)?"paired":S.sel===i?"sel":""} ${S.wrong==="L"+i?"bad":""}" data-act="mL" data-v="${i}" ${S.pairs.includes(i)?"disabled":""}>${t}</button>`).join("")}</div>
  <div class="grid">${R.map((t,k)=>{const i=S.order[k];return `<button class="mcard ${S.pairs.includes(i)?"paired":""} ${S.wrong==="R"+i?"bad":""}" data-act="mR" data-v="${i}" ${S.pairs.includes(i)?"disabled":""}>${t}</button>`;}).join("")}</div></div>`;}
 return `<div class="fade">${LessonTop(l)}<div class="row" style="justify-content:center;gap:6px;margin-bottom:14px">${["أقرأ","أستكشف","أختار","صح/خطأ","أصِل"].map((n,i)=>`<span class="badge" style="${i===si?"background:var(--teal);color:#fff":i<si?"background:var(--ok-soft);color:var(--ok)":""}">${i<si?"✓ ":""}${n}</span>`).join("")}</div>${body}</div>`;};

V.ldone=()=>{const l=S.lesson,mx=maxScore(l);const pct=Math.round(S.score/mx*100);return `<div class="fade narrow celebrate" style="margin:auto"><div class="big">${pct>=80?"🏆":pct>=50?"🌟":"💪"}</div>
 <h1 style="font-size:2.2em;color:var(--teal);margin-top:10px">${pct>=80?"ممتازة يا "+S.me.short+"!":pct>=50?"أحسنتِ يا "+S.me.short+"!":"محاولة رائعة يا "+S.me.short+"!"}</h1>
 <p style="font-size:1.3em;margin:8px 0 16px">أنهيتِ درس <b>${l.title}</b> وجمعتِ <b style="color:var(--gold-ink)">${S.score} ⭐</b> من ${mx}</p>
 <div class="card" style="text-align:start;margin-bottom:16px">${Bar(pct,"نتيجتي في هذا الدرس")}</div>
 <div class="grid g2"><button class="btn primary big" data-act="go" data-v="hub">دروسي 📚</button><button class="btn gold big" data-act="lesson" data-v="${l.id}">أعيد الدرس 🔁</button></div></div>`;};

V.activity=()=>{const a=ACTIVITIES[S.idx];return `<div class="fade narrow" style="margin:auto">${Top(`<button class="iconbtn" data-act="go" data-v="hub">✕</button>`,`<b style="font-size:1.3em">روتيني اليومي 🌼</b>`)}
 <div class="sched">${ACTIVITIES.map((x,i)=>`<div class="${i<S.idx?"done":i===S.idx?"now":"next"}">${x.emoji}</div>`).join("")}</div>
 <div class="card center"><div style="font-size:6em;line-height:1">${a.emoji}</div><h2 style="font-size:2em;margin:10px 0">${a.title}</h2><p style="font-size:1.25em">${a.say}</p><button class="speak" data-act="say" data-say="${esc(a.say)}" style="margin:12px 0 20px;font-size:1.1em">🔊 اسمعي</button>
 <p class="muted" style="margin-bottom:10px">هل فعلتِها؟</p><div class="grid g2"><button class="opt" data-act="did" data-v="alone" style="border-color:var(--ok)">💪 وحدي</button><button class="opt" data-act="did" data-v="help" style="border-color:var(--gold)">🤝 بمساعدة</button></div></div></div>`;};

V.comm=()=>{const pk=S.cpage||"need",pg=COMM_PAGES[pk];return `<div class="fade">${Top(`<button class="iconbtn" data-act="go" data-v="hub">✕</button>`,`<b style="font-size:1.3em">أريد أن أقول 🗣️</b>`)}
 <div class="sentence" id="sentence">${pg.starter?`<span class="w">${pg.starter}</span>`:""}${(S.sent||[]).map(x=>`<span class="w">${x.ph?`<img src="${x.ph}" class="ph" style="width:44px;height:44px;border-radius:50%;object-fit:cover">`:x.e} ${x.t}</span>`).join("")||`<span class="muted mini" style="font-size:.6em">المسي صورةً لتكوّني جملتكِ…</span>`}<span style="flex:1"></span><button class="speak" data-act="commsay" style="font-size:.7em">🔊 قولي جملتي</button></div>
 <div class="commpages">${Object.entries(COMM_PAGES).map(([k,g])=>`<button class="${k===pk?"on":""}" data-act="commpage" data-v="${k}">${g.e} ${g.t}</button>`).join("")}</div>
 <div class="grid g3">${pg.items.map((c,i)=>{const ph=c.k&&DB.people[c.k];return `<button class="tile" data-act="commpick" data-v="${i}" style="min-height:140px">${ph?`<img class="ph" src="${ph.data}" alt="">`:`<span class="ic">${c.e}</span>`}<span class="t">${c.t}</span></button>`;}).join("")}</div>
 ${(DB.said[S.me.id]||[]).filter(x=>x.reply).slice(-2).map(x=>`<div class="card" style="margin-top:14px;background:var(--gold-soft);border-color:var(--gold)"><b>قلتِ: ${x.e} ${esc(x.t)}</b><div>💬 ${esc(x.reply.by)}: <span style="font-family:var(--display);font-size:1.15em">${esc(x.reply.t)}</span> <button class="speak" data-act="say" data-say="${esc(x.reply.t)}">🔊</button></div></div>`).join("")}</div>`;};

V.mystars=()=>{const me=S.me,done=DB.lessons[me.id]||{},rt=DB.ratings[me.id]||{};return `<div class="fade">${Top(`<button class="iconbtn" data-act="go" data-v="hub">✕</button>`,`<b style="font-size:1.3em">نجومي 🏆</b>`)}
 <div class="card center" style="background:var(--gold-soft);border-color:var(--gold)"><div style="font-size:4em">⭐</div><div style="font-family:var(--display);font-size:3em;font-weight:800;color:var(--gold-ink)">${DB.stars[me.id]||0}</div><p>نجمة جمعتِها بجهدكِ</p></div>
 <div class="grid g2" style="margin-top:14px">${LESSONS.map(l=>`<div class="card" style="border-color:${done[l.id]?"var(--ok)":"var(--line)"}"><div class="row between"><b>${l.icon} ${l.title}</b>${done[l.id]?`<span class="badge" style="background:var(--ok-soft);color:var(--ok)">✓ ${done[l.id].score}/${done[l.id].max}</span>`:`<span class="badge">لم يبدأ</span>`}</div>${rt[l.id]?`<div style="margin-top:8px">${Stars(rt[l.id].stars)}<div class="mini muted">من معلمتكِ: ${esc(rt[l.id].t)}</div></div>`:""}</div>`).join("")}</div>
 <h3 style="margin:18px 0 8px">🌸 نجومي في صُنّاع الأثر</h3><div class="grid g2">${CRAFTS.map(c=>{const r=crRec(me.id,c.id);const rt=(DB.ratings[me.id]||{})["cr_"+c.id];return `<div class="card" style="border-color:${r.done?"var(--ok)":"var(--line)"}"><div class="row between"><b>${c.icon} ${c.title}</b><span class="badge" style="${r.done?"background:var(--ok-soft);color:var(--ok)":""}">${r.done?"✓ أنجزتُ قالبي":crPct(r)+"٪"} · ⭐ ${r.stars}</span></div>${rt?`<div style="margin-top:8px">${Stars(rt.stars)}<div class="mini muted">من معلمتكِ: ${esc(rt.t)}</div></div>`:""}${r.photo?`<img src="${r.photo}" class="thumb" style="margin-top:8px" alt="">`:""}</div>`;}).join("")}</div>
 <div class="center" style="margin-top:16px"><button class="btn ghost" data-act="say" data-say="أنتِ بطلة يا ${me.short}، جمعتِ ${DB.stars[me.id]||0} نجمة">🔊 اسمعي تشجيعًا</button></div></div>`;};
</script>
<script>
/* ====================== مشروع صُنّاع الأثر — الدروس المهنية ====================== */
const LVL={1:"دعم كامل",2:"دعم جزئي",3:"مستقلة"},LVL_E={1:"🤝",2:"🤲",3:"💪"},
LVL_D={1:"٣ خطوات كبيرة، والمعلمة تساعد في كل خطوة",2:"٥ خطوات مع تلميحات ومساعدة عند الحاجة",3:"جميع الخطوات الثماني تنفّذها بنفسها"};

/* ——— مكتبة الرسم (SVG ثلاثي الأبعاد بتدرجات لونية) ——— */
const SV=(inner,vb="0 0 100 100")=>`<svg viewBox="${vb}" class="art" aria-hidden="true" focusable="false">${inner}</svg>`;
const shd=(cx=50,cy=91,rx=28,ry=4.5)=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="rgba(30,44,49,.16)"/>`;
const flower=(x,y,r,g="gPink",n=6)=>{let p="";for(let i=0;i<n;i++)p+=`<ellipse cy="${-r*.6}" rx="${r*.4}" ry="${r*.62}" fill="url(#${g})" stroke="rgba(0,0,0,.07)" transform="rotate(${i*360/n})"/>`;return `<g transform="translate(${x} ${y})">${p}<circle r="${r*.3}" fill="url(#gYellow)"/><circle r="${r*.13}" fill="#B77A17" opacity=".55"/></g>`;};
const rose=(x,y,r,g="gPink")=>`<g transform="translate(${x} ${y})"><circle r="${r}" fill="url(#${g})" stroke="rgba(0,0,0,.08)"/><circle r="${r*.7}" cx="${r*.1}" cy="${-r*.08}" fill="url(#${g})" stroke="rgba(0,0,0,.12)"/><circle r="${r*.42}" cx="${-r*.05}" cy="${r*.05}" fill="url(#${g})" stroke="rgba(0,0,0,.14)"/><path d="M${-r*.2} ${-r*.1}q${r*.25} ${-r*.25} ${r*.35} 0" stroke="rgba(0,0,0,.18)" fill="none"/></g>`;
const leaf=(x,y,rot,len=22,w=9)=>`<g transform="translate(${x} ${y}) rotate(${rot})"><path d="M0 0C${w} ${-len*.35} ${w} ${-len*.75} 0 ${-len}C${-w} ${-len*.75} ${-w} ${-len*.35} 0 0Z" fill="url(#gGreen)"/><path d="M0 -2V${-len+3}" stroke="rgba(255,255,255,.5)"/></g>`;
const stem=(x1,y1,x2,y2,w=2.6)=>`<path d="M${x1} ${y1}L${x2} ${y2}" stroke="#3E8E5A" stroke-width="${w}" stroke-linecap="round"/>`;
const heart=(x,y,s=1,c="#E4788F")=>`<path d="M0 -2C-2 -6 -8 -4 -6 1C-4 4 0 6 0 6C0 6 4 4 6 1C8 -4 2 -6 0 -2Z" transform="translate(${x} ${y}) scale(${s})" fill="${c}"/>`;
const tagArt=(x,y,rot=0,s=1)=>`<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})"><rect x="-9" y="-6" width="18" height="12" rx="2" fill="#FFF8F0" stroke="#D9C7B0"/><circle cx="-6" cy="0" r="1.3" fill="#D9C7B0"/>${heart(3,0,.55)}</g>`;
const bow=(x,y,s=1,c="#E4788F",c2="#C9526C")=>`<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="-9" cy="-1" rx="9" ry="6" fill="${c}" stroke="${c2}"/><ellipse cx="9" cy="-1" rx="9" ry="6" fill="${c}" stroke="${c2}"/><path d="M-3 3l-5 14h5l3-9zM3 3l5 14h-5l-3-9z" fill="${c2}"/><circle r="3.2" fill="${c2}"/></g>`;
const sparkles=(pts,c="#F0AE33")=>`<g fill="${c}">${pts.map(([x,y,s=1])=>`<path transform="translate(${x} ${y}) scale(${s})" d="M0-4l1.2 2.8L4 0l-2.8 1.2L0 4l-1.2-2.8L-4 0l2.8-1.2z"/>`).join("")}</g>`;

const burst=el=>{try{if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const r=el.getBoundingClientRect();const box=document.createElement("div");box.className="burst";box.style.left=(r.left+r.width/2)+"px";box.style.top=(r.top+r.height/2)+"px";const em=["✨","⭐","💖","🌸"];for(let i=0;i<8;i++){const s=document.createElement("i");s.textContent=em[i%4];s.style.setProperty("--dx",(Math.cos(i/8*6.283)*70)+"px");s.style.setProperty("--dy",(Math.sin(i/8*6.283)*70)+"px");box.appendChild(s);}document.body.appendChild(box);setTimeout(()=>box.remove(),900);}catch(e){}};
