  <p style="font-size:1.2em;max-width:60ch;margin:auto">${c.intro}</p>
  <div class="note rose" style="margin:14px auto 0;max-width:60ch;text-align:start">🛡️ <b>السلامة:</b> ${c.safety}</div>
  <div class="row" style="justify-content:center;margin-top:16px"><button class="btn gold" data-act="cr_say" data-say="${esc(c.intro)}">🔊 اسمعي الدرس</button><button class="btn line" data-act="cr_say" data-say="${esc(c.safety)}">🔊 اسمعي السلامة</button></div>
  <div style="margin-top:22px"><button class="btn primary big" data-act="cr_step" data-v="tools">التالي: أدواتي 🧰 ▶</button></div></div>`;}
 else if(S.cr.step==="tools"){const need=Math.min(4,c.tools.length);body=`<h2 class="center" style="font-size:1.6em">المسي الأداة لتعرفيها 👆🔊</h2><p class="center muted" style="margin-bottom:16px">كل أداةٍ تنطقُ وتنقلبُ لتُخبركِ ما فائدتها — ${S.cr.tools.size} من ${c.tools.length}</p>
  <div class="grid g3">${c.tools.map((t,i)=>`<button class="toolcard ${S.cr.tools.has(i)?"said":""} ${S.cr.flipped.has(i)?"flip":""}" data-act="cr_tool" data-v="${i}" aria-label="${t.t}"><div class="in"><div class="f">${ART(t.k)}<span class="lbl">${t.t}</span><span class="spk">${S.cr.tools.has(i)?"✓ عرفتُها":"🔊 المسي"}</span></div><div class="b"><span style="font-size:2.4em;line-height:1">${t.e}</span><span class="lbl">${t.t}</span><span class="mini">${t.s}</span></div></div></button>`).join("")}</div>
  <div style="margin-top:22px;max-width:520px;margin-inline:auto"><button class="btn primary big" data-act="cr_step" data-v="steps" ${S.cr.tools.size<need?"disabled style='opacity:.5'":""}>${S.cr.tools.size<need?`المسي ${need} أدواتٍ على الأقل`:"جاهزة للخطوات ▶"}</button></div>`;}
 else if(S.cr.step==="steps"){const st=c.steps[S.cr.si];body=`${Dots(c.steps.length,S.cr.si)}<div class="card center" style="border-color:${c.accent}"><span class="badge">الخطوة ${S.cr.si+1} من ${c.steps.length}</span>
  <div class="stage" style="margin:10px auto 0"><div class="tilt stepart" data-act="cr_say" data-say="${esc(st.s)}">${st.art()}</div></div>
  <h2 style="font-size:1.8em;margin:8px 0 4px">${st.t}</h2><p style="font-size:1.25em;max-width:50ch;margin:auto">${st.s}</p>
  ${st.warn?`<div class="note rose" style="margin:12px auto 0;max-width:50ch;text-align:start">⚠️ ${st.warn}</div>`:""}
  <button class="speak" data-act="cr_say" data-say="${esc(st.s)}" style="margin:12px 0;font-size:1.05em">🔊 اسمعي مرةً أخرى</button>
  <div class="grid g2"><button class="btn ghost big" data-act="cr_prev" ${S.cr.si===0?"disabled style='opacity:.4'":""}>◀ السابقة</button><button class="btn primary big" data-act="cr_next">${S.cr.si+1<c.steps.length?"فهمتُ، التالية ▶":"جاهزة للتركيب 🧩"}</button></div></div>`;}
 else if(S.cr.step==="build"){const parts=activeParts(c,lvl);const next=parts.find(p=>!S.cr.placed.includes(p.k));const show=preShow(c,lvl);S.cr.placed.forEach(k=>show[k]=1);const done=!next;
  body=`<h2 class="center" style="font-size:1.6em">ركّبي ${c.obj} بنفسكِ 🧩</h2><p class="center muted" style="margin-bottom:10px">المسي الجزءَ الذي أطلبُه ليطيرَ إلى مكانه — ${S.cr.placed.length} من ${parts.length}</p>
  <div class="card center" style="border-color:${c.accent};padding:14px">${Hero3D(c.scene(show,r.design),S.cr.fly?"flyin":"")}
   ${done?`<h2 style="color:var(--teal);font-size:1.8em">اكتملت ${c.obj}! 🎉</h2><p class="muted">صنعتِها بنفسكِ خطوةً خطوة</p><div style="margin-top:14px;max-width:520px;margin-inline:auto"><button class="btn primary big" data-act="cr_step" data-v="tpl">الآن قالبي الخاص 🎨 ▶</button></div>`
   :`<div class="soft" style="background:var(--gold-soft);font-family:var(--display);font-size:1.35em;font-weight:800;display:inline-flex;gap:10px;align-items:center;padding:10px 20px">👉 ضعي: ${next.t} <button class="speak" data-act="cr_say" data-say="ضعي ${esc(next.t)}">🔊</button></div>`}</div>
  ${done?"":`<div class="grid g3" style="margin-top:14px">${S.cr.order.filter(k=>!S.cr.placed.includes(k)).map(k=>{const p=parts.find(x=>x.k===k);return `<button class="tile part ${S.cr.hint===k?"hint":""} ${S.cr.wrong===k?"bad":""}" data-act="cr_part" data-v="${k}"><div style="width:96px;height:96px">${c.partArt(k,r.design)}</div><span class="t" style="font-size:1.05em">${p.t}</span></button>`;}).join("")}</div>`}`;}
 else if(S.cr.step==="tpl"){const qs=c.design;const tq=S.cr.tq;
  if(tq<qs.length){const q=qs[tq];const cur=r.design[q.k];body=`${Dots(qs.length+1,tq)}<div class="card center" style="border-color:${c.accent}"><span class="badge">قالبي 🎨 — ${tq+1} من ${qs.length}</span>
   <h2 style="font-size:1.7em;margin:8px 0">${q.t} <button class="speak" data-act="cr_say" data-say="${esc(q.t)}">🔊</button></h2>
   <div class="row" style="justify-content:center;gap:14px;margin:10px 0 6px">${q.opts.map(o=>{const on=Array.isArray(cur)?cur.includes(o.v):cur===o.v;return `<button class="swatchbtn ${on?"on":""}" data-act="cr_pick" data-v="${tq}:${o.v}" aria-pressed="${on}"><span class="swatch" style="background:${o.c||"var(--card2)"}">${o.e||""}${on?`<i class="swck">✓</i>`:""}</span><span class="t">${o.t}</span></button>`;}).join("")}</div>
   ${q.multi?`<p class="muted mini">اختاري حتى ${q.multi} ألوان — الأخيرُ يستبدلُ الأول</p>`:""}
   ${Hero3D(c.scene(ALL_SHOW,r.design))}
   <div style="margin-top:12px;max-width:520px;margin-inline:auto"><button class="btn primary big" data-act="cr_tplnext">${tq+1<qs.length?"التالي ▶":"شاهدي تصميمي ✨"}</button></div></div>`;}
  else{const st=tplSteps(c,lvl);const all=r.checked.length>=st.length;body=`${Dots(qs.length+1,qs.length)}<div class="card center" style="border-color:${c.accent}"><h2 style="font-size:1.9em;color:var(--teal)">هذا تصميمي! ✨</h2><p class="muted">${designText(c,r.design)}</p>
   ${Hero3D(c.scene(ALL_SHOW,r.design),"",`data-act="cr_say" data-say="هذا تصميمي الجميل"`)}
   <div class="row" style="justify-content:center"><span class="badge" style="background:var(--teal-soft);color:var(--teal);font-size:1em">${LVL_E[lvl]} ${LVL[lvl]} — ${st.length} خطوات</span><button class="pill" data-act="cr_redesign">🎨 غيّري التصميم</button></div>
   <p style="font-size:1.2em;margin-top:14px">الآن أصنعُها بيدي في الصف — أضعُ ✓ عند كلِّ خطوةٍ أنجزُها <button class="speak" data-act="cr_say" data-say="الآن اصنعيها بيديك. المسي كل خطوة تنجزينها">🔊</button></p>
   <div class="grid g2" style="margin-top:12px;text-align:start">${st.map((t,i)=>{const on=r.checked.includes(i);return `<button class="checkt ${on?"on":""}" data-act="cr_check" data-v="${i}" aria-pressed="${on}"><span class="num">${i+1}</span><div class="ico">${c.steps[t.i].art()}</div><span class="t">${t.t}</span><span class="ck">${on?"✓":""}</span></button>`;}).join("")}</div>
   ${all?`<div class="note ok" style="margin-top:14px;text-align:start">🏅 أنجزتِ قالبكِ كاملًا${r.doneAt?` يوم ${r.doneAt}`:""} — أنتِ صانعةُ أثر!</div>`:""}
   ${r.photo?`<img src="${r.photo}" class="photo" alt="صورة منتجي">`:""}
   <div class="row" style="justify-content:center;margin-top:14px"><label class="btn ghost" style="cursor:pointer">📷 أضيفي صورةَ منتجي<input type="file" accept="image/*" capture="environment" hidden data-photo="${c.id}"></label><button class="btn line" data-act="cr_print" data-v="${c.id}:${S.me.id}">🖨️ اطبعي قالبي</button><button class="btn primary" data-act="go" data-v="hub">دروسي 📚</button></div></div>`;}}
 return `<div class="fade">${top}<div class="row" style="justify-content:center;gap:6px;margin-bottom:14px">${CR_NAMES.map((n,i)=>`<button class="badge" data-act="cr_step" data-v="${CR_STEPS[i]}" style="${i===si?"background:var(--teal);color:#fff":i<si?"background:var(--ok-soft);color:var(--ok)":""}">${i<si?"✓ ":""}${n}</button>`).join("")}</div>${body}</div>`;};

/* ——— طباعة قالب الطالبة ——— */
const printTpl=(c,r,s)=>{const st=tplSteps(c,r.level);const el=document.getElementById("print");el.innerHTML=`<div class="pt"><div class="row between"><b>أجنحة الأمل · مشروع صُنّاع الأثر</b><b>الطالبة: ${esc(s.name)}</b></div><h1>${c.icon} قالبُ عملي: ${c.title}</h1><div class="row" style="align-items:flex-start;gap:24px"><div style="width:220px;flex:none">${c.scene(ALL_SHOW,r.design)}</div><div><p><b>مستوى الدعم:</b> ${LVL_E[r.level]} ${LVL[r.level]}</p><p><b>تصميمي:</b> ${designText(c,r.design)}</p><p><b>السلامة:</b> ${c.safety}</p><p>التاريخ: ______________</p></div></div><h2>خطواتي</h2><ol>${st.map((t,i)=>`<li><span class="box">${r.checked.includes(i)?"✓":""}</span><span class="ico">${c.steps[t.i].art()}</span><span>${t.t}</span></li>`).join("")}</ol><p class="sig">تقييم المعلمة: ☆ ☆ ☆ ☆ ☆ &nbsp; توقيع المعلمة: ____________ &nbsp; توقيع ولي الأمر: ____________</p><p class="sig">إعداد المعلمة: نسيم عكام · مديرة المدرسة: عفاف صباغ · ١٤٤٨هـ</p></div>`;setTimeout(()=>window.print(),80);};

/* ——— الصور: ضغط وحفظ محلي ——— */
document.addEventListener("change",e=>{const inp=e.target;if(!inp.matches||!inp.matches("input[type=file][data-photo]"))return;const f=inp.files&&inp.files[0];if(!f)return;const sid=inp.dataset.sid?+inp.dataset.sid:(S.me?S.me.id:S.cs);const cid=inp.dataset.photo;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,520/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);const r=crRec(sid,cid);r.photo=cv.toDataURL("image/jpeg",.72);save();tone("ok");toast("حُفظت صورة المنتج 📷");render();};img.src=rd.result;};rd.readAsDataURL(f);});

/* ——— التفاعل ثلاثي الأبعاد: إمالة العناصر مع الإصبع/المؤشر ——— */
document.addEventListener("pointerover",e=>{const t=e.target.closest&&e.target.closest("[data-greet]");if(t&&!(e.relatedTarget&&t.contains(e.relatedTarget)))greetStudent(+t.dataset.greet,t);});
document.addEventListener("focusin",e=>{const t=e.target.closest&&e.target.closest("[data-greet]");if(t)greetStudent(+t.dataset.greet,t);});
document.addEventListener("pointermove",e=>{const t=e.target.closest&&e.target.closest(".tilt");if(!t)return;const r=t.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;t.style.transform=`rotateY(${(x*22).toFixed(1)}deg) rotateX(${(-y*22).toFixed(1)}deg) translateZ(14px)`;},{passive:true});
document.addEventListener("pointerout",e=>{const t=e.target.closest&&e.target.closest(".tilt");if(t&&!(e.relatedTarget&&t.contains(e.relatedTarget)))t.style.transform="";});

/* ——— معالجة أحداث المشروع ——— */
document.addEventListener("click",e=>{const b=e.target.closest("[data-act^='cr_']");if(!b)return;const act=b.dataset.act,v=b.dataset.v;const c=S.cr&&S.cr.c;
 switch(act){
  case "cr_open":{const cc=craftOf(v);S.cr={c:cc,step:"watch",si:0,tools:new Set(),flipped:new Set(),placed:[],wrongN:0,wrong:null,hint:null,order:[],tq:0,fly:false};speak(cc.title+". "+cc.slogan);tone("tap");go("craft");break;}
  case "cr_say":speak(b.dataset.say);burst(b);break;
  case "cr_step":{if(!c)break;const r=crRec(S.me.id,c.id);S.cr.step=v;S.cr.wrong=null;S.cr.fly=false;
   if(v==="tools")speak("المسي الأداة لتعرفيها");
   if(v==="steps"){S.cr.si=0;if(!r.tools&&S.cr.tools.size>=Math.min(4,c.tools.length)){r.tools=true;r.stars+=2;award(2);save();}speak(c.steps[0].s);}
   if(v==="build"){S.cr.placed=[];S.cr.wrongN=0;S.cr.hint=null;const parts=activeParts(c,r.level);S.cr.order=rnd(parts.map(p=>p.k));speak("ركّبي بنفسكِ. ضعي "+parts[0].t);}
   if(v==="tpl"){S.cr.tq=r.checked.length?c.design.length:0;speak(S.cr.tq?"هذا تصميمكِ. المسي كل خطوة تنجزينها":c.design[0].t);}
   go("craft");break;}
  case "cr_tool":{const i=+v,t=c.tools[i];S.cr.tools.add(i);if(S.cr.flipped.has(i))S.cr.flipped.delete(i);else S.cr.flipped.add(i);speak(t.s);tone("tap");burst(b);render();break;}
  case "cr_prev":S.cr.si=Math.max(0,S.cr.si-1);tone("tap");speak(c.steps[S.cr.si].s);render();break;
  case "cr_next":{if(S.cr.si+1<c.steps.length){S.cr.si++;tone("tap");speak(c.steps[S.cr.si].s);render();}else{const r=crRec(S.me.id,c.id);if(!r.steps){r.steps=true;r.stars+=3;award(3);save();toast("تعلّمتِ كل الخطوات ⭐⭐⭐");}tone("ok");S.cr.step="build";S.cr.placed=[];S.cr.wrongN=0;S.cr.hint=null;const parts=activeParts(c,r.level);S.cr.order=rnd(parts.map(p=>p.k));speak("أحسنتِ! الآن ركّبي بنفسكِ. ضعي "+parts[0].t);go("craft");}break;}
  case "cr_part":{const r=crRec(S.me.id,c.id);const parts=activeParts(c,r.level);const next=parts.find(p=>!S.cr.placed.includes(p.k));if(!next)break;
   if(v===next.k){S.cr.placed.push(v);S.cr.wrongN=0;S.cr.hint=null;S.cr.fly=true;award(1);r.stars+=1;tone("ok");burst(b);const after=parts.find(p=>!S.cr.placed.includes(p.k));if(after){speak("أحسنتِ! الآن ضعي "+after.t);}else{r.build=true;setTimeout(()=>{confetti();tone("win");speak(`ممتازة يا ${S.me.short}! اكتملت ${c.obj}`);},250);}save();render();}
   else{S.cr.wrong=v;S.cr.wrongN++;if(S.cr.wrongN>=2)S.cr.hint=next.k;tone("bad");speak("ليس هذا. نحتاجُ "+next.t);render();setTimeout(()=>{S.cr.wrong=null;render();},450);}break;}
  case "cr_pick":{const [qi,val]=v.split(/:(.+)/);const q=c.design[+qi];const r=crRec(S.me.id,c.id);if(q.multi){let arr=(r.design[q.k]||[]).slice();const at=arr.indexOf(val);if(at>=0){if(arr.length>1)arr.splice(at,1);}else{arr.push(val);if(arr.length>q.multi)arr.shift();}r.design[q.k]=arr;}else r.design[q.k]=val;const o=q.opts.find(x=>x.v===val);speak(o?o.t:"");tone("tap");burst(b);save();render();break;}
  case "cr_tplnext":{if(S.cr.tq<c.design.length){S.cr.tq++;tone("tap");if(S.cr.tq<c.design.length)speak(c.design[S.cr.tq].t);else{speak("هذا تصميمكِ الجميل! الآن اصنعيه بيديكِ، والمسي كل خطوة تنجزينها");confetti();}render();}break;}
  case "cr_redesign":S.cr.tq=0;tone("tap");speak(c.design[0].t);render();break;
  case "cr_check":{const r=crRec(S.me.id,c.id);const i=+v;const st=tplSteps(c,r.level);const at=r.checked.indexOf(i);if(at>=0){r.checked.splice(at,1);tone("tap");}else{r.checked.push(i);tone("ok");speak("أحسنتِ! "+st[i].t);burst(b);}
   if(r.checked.length>=st.length&&!r.done){r.done=true;r.doneAt=today();r.stars+=3;award(3);setTimeout(()=>{confetti();tone("win");speak(`أنهيتِ قالبكِ يا ${S.me.short}! أنتِ صانعةُ أثر`);},300);}save();render();break;}
  case "cr_print":{const [cid,sid]=v.split(":");printTpl(craftOf(cid),crRec(+sid,cid),stu(+sid));break;}
  case "cr_level":{const [cid,l]=v.split(":");const r=crRec(S.cs,cid);r.level=+l;const n=tplSteps(craftOf(cid),+l).length;r.checked=r.checked.filter(i=>i<n);if(r.checked.length<n)r.done=false;save();tone("tap");toast("حُفظ مستوى الدعم");render();break;}
  case "cr_delphoto":{const r=crRec(S.cs,v);r.photo=null;save();render();break;}
  case "cr_reset":{const cc=craftOf(v);const r=crRec(S.cs,v);Object.assign(r,{tools:false,steps:false,build:false,checked:[],done:false,doneAt:"",stars:0,design:JSON.parse(JSON.stringify(cc.def))});save();toast("أُعيد الدرس إلى البداية 🔁");render();break;}
 }});

</script>
<script>
/* ====================== شاشات الفريق ====================== */
const StaffTop=()=>Top(`${A11y()}<button class="btn ghost" data-act="leave" style="width:auto;min-height:44px;padding:6px 14px">خروج ✕</button>`,`<div class="brand">${Logo(38)} <span>${ROLE_ICON[S.role]} ${esc(S.staff.name)}</span><span class="badge">${ROLE_AR[S.role]}</span></div>`);
const StudentPicker=(list=STUDENTS)=>`<div class="grid g3" style="margin-bottom:16px">${list.map(s=>`<button class="stu ${S.cs==s.id?"on":""}" data-act="cs" data-v="${s.id}">${Avatar(s,52)}<span><b style="display:block;font-size:1.1em">${s.name}</b><span class="mini muted">${progressOf(s.id)}٪ · ⭐ ${DB.stars[s.id]||0}</span></span></button>`).join("")}</div>`;
const Tabs=(tabs)=>`<div class="tabs" role="tablist">${tabs.map(([k,t])=>`<button role="tab" class="${S.tab===k?"on":""}" data-act="tab" data-v="${k}">${t}</button>`).join("")}</div>`;
const NoteList=(arr,cls="")=>arr.length?`<div class="feed">${arr.slice().reverse().map(n=>`<div class="note ${cls}"><div class="row between mini"><b>${n.cat?`<span class="badge">${esc(n.cat)}</span> `:""}${esc(n.by||"")}${n.role?` · <span class="muted">${esc(n.role)}</span>`:""}</b><span class="muted">${esc(n.d||"")}</span></div><div>${esc(n.t)}</div></div>`).join("")}</div>`:`<p class="muted center" style="padding:14px">لا توجد ملاحظات بعد.</p>`;
const ProgressPanel=(sid)=>{const s=stu(sid),done=DB.lessons[sid]||{},rt=DB.ratings[sid]||{};return `<div class="grid g3" style="margin-bottom:14px"><div class="kpi"><div class="n">${progressOf(sid)}٪</div><div class="muted mini">إتقان الدروس</div></div><div class="kpi"><div class="n">${lessonsDone(sid)}/${LESSONS.length}</div><div class="muted mini">دروس مكتملة</div></div><div class="kpi"><div class="n">⭐ ${DB.stars[sid]||0}</div><div class="muted mini">النجوم المجموعة</div></div></div>
 ${Bar(progressOf(sid),"التقدّم العام")}
 <div class="grid" style="margin-top:14px">${LESSONS.map(l=>{const d=done[l.id],r=rt[l.id];return `<div class="soft row between"><div class="row"><span style="font-size:1.6em">${l.icon}</span><div><b>${l.title}</b><div class="mini muted">${d?`أنهتها الطالبة: ${d.score}/${d.max}`:"لم تبدأ بعد"}</div></div></div><div style="text-align:end">${r?Stars(r.stars):`<span class="muted mini">بلا تقييم</span>`}${r&&r.t?`<div class="mini muted">${esc(r.t)}</div>`:""}</div></div>`;}).join("")}</div>
 <h3 style="margin:18px 0 8px">😊 مشاعرها الأخيرة</h3><div class="row">${(DB.moods[sid]||[]).slice(-6).map(m=>`<span class="badge">${m.e} ${m.t} · ${m.d}</span>`).join("")||'<span class="muted">لم تسجّل بعد</span>'}</div>${CraftSummary(sid)}`;};

/* ——— محطات خطة المتابعة ——— */
const stageOf=p=>p>=85?["مُتقنة","var(--ok-soft)","var(--ok)"]:p>=60?["تتقدّم","var(--teal-soft)","var(--teal)"]:p>=30?["في الطريق","var(--gold-soft)","var(--gold-ink)"]:["بداية","var(--rose-soft)","var(--rose)"];
const Ring=(pct,color,ic)=>{const r=30,c=2*Math.PI*r;return `<div class="ring"><svg viewBox="0 0 76 76"><circle cx="38" cy="38" r="${r}" fill="none" stroke="var(--card2)" stroke-width="9"/><circle cx="38" cy="38" r="${r}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}" style="transition:stroke-dashoffset .6s"/></svg><span class="pct">${pct}٪</span>${ic?`<span class="ic">${ic}</span>`:""}</div>`;};
const planAvg=sid=>{const p=DB.plan[sid]||{};const v=PLAN_TEMPLATE.map(t=>(p[t.id]||{pct:0}).pct);return Math.round(v.reduce((a,b)=>a+b,0)/v.length);};
const Journey=(sid,{mode="view"}={})=>{const p=DB.plan[sid]||{};const ap=DB.planApproved[sid];const s=stu(sid);
 return `<div class="card" style="padding:16px 14px 6px">
  <div class="row between" style="margin-bottom:6px"><div><h3 style="font-size:1.3em">🛤️ خطة متابعة ${s.short} — محطات الرحلة</h3><span class="muted mini">متوسط التقدّم ${planAvg(sid)}٪ · ${PLAN_TEMPLATE.filter(t=>(p[t.id]||{}).pct>=85).length} محطات مُتقنة</span></div>
  ${ap?`<span class="badge" style="background:var(--ok-soft);color:var(--ok)">✓ اعتمدتها ${esc(ap.by)} · ${ap.d}</span>`:`<span class="badge">بانتظار اعتماد الوكيلة</span>`}</div>
  <div class="journey ${mode==="student"?"":"compact"}">${PLAN_TEMPLATE.map((t,i)=>{const it=p[t.id]||{pct:0,note:""};const [lbl,bg,fg]=stageOf(it.pct);
   return `<div class="station">${mode==="student"?`<button data-act="say" data-say="${esc(t.t)}. ${esc(t.d)}. تقدّمكِ ${it.pct} بالمئة" style="padding:0">${Ring(it.pct,t.c,t.ic)}</button>`:Ring(it.pct,t.c,t.ic)}
    <div class="stcard"><span class="num">${String(i+1).padStart(2,"0")}</span><div class="row between"><h4>${t.t}</h4><span class="stage" style="background:${bg};color:${fg}">${lbl}</span></div><div class="d">${t.d}</div>
    ${it.note&&mode!=="edit"?`<div class="mini" style="margin-top:6px;color:var(--teal)">✎ ${esc(it.note)}</div>`:""}
    ${mode==="edit"?`<input type="range" min="0" max="100" step="5" value="${it.pct}" id="pl-${t.id}" data-plan="${t.id}" aria-label="تقدّم ${t.t}"><div class="row" style="margin-top:6px"><input type="text" id="pn-${t.id}" value="${esc(it.note)}" placeholder="ملاحظة على هذه المحطة…" style="flex:1;padding:8px 12px"><button class="btn primary" data-act="plansave" data-v="${t.id}" style="min-height:42px;padding:6px 14px">حفظ</button></div>`:""}
    </div></div>`;}).join("")}</div></div>`;};

/* ——— صندوق ملفات الطالبة ——— */
const fmtSize=b=>b>1048576?(b/1048576).toFixed(1)+" م.ب":Math.round(b/1024)+" ك.ب";
const FilesBox=(sid,{canUpload=false}={})=>{const s=stu(sid),arr=DB.files[sid]||[];const total=arr.reduce((a,f)=>a+f.size,0);
 return `<div class="folder" style="margin-bottom:14px"><span class="tab">📁</span><div style="flex:1"><h3>ملف ${s.short} — التقارير والأوراق</h3><span class="muted mini">${arr.length} ملف · ${fmtSize(total)} · يظهر للمعلمة وولي الأمر والإدارة</span></div></div>
 ${canUpload?`<label class="dropzone" id="dz" for="fileinp"><div style="font-size:2.4em">📎</div><b style="font-family:var(--display);font-size:1.15em">اسحبي التقرير هنا أو اضغطي للاختيار</b><div class="muted mini">صور أو PDF — حتى ٣ م.ب للملف</div><input type="file" id="fileinp" accept="image/*,application/pdf" multiple class="sr"></label>
  <div class="row" style="margin:10px 0 14px"><span class="muted mini">تصنيف الملف:</span><select id="fcat" style="width:auto">${FILE_CATS.map(c=>`<option>${c}</option>`).join("")}</select></div>`:""}
 ${arr.length?`<div class="files">${arr.slice().reverse().map(f=>`<div class="file"><div class="thumb">${f.type.startsWith("image/")?`<img src="${f.data}" alt="${esc(f.name)}">`:"📄"}</div><div class="meta"><span class="badge" style="align-self:start">${esc(f.cat)}</span><b>${esc(f.name)}</b><span class="muted mini">${esc(f.by)} · ${f.d} · ${fmtSize(f.size)}</span><div class="row"><button class="btn ghost" data-act="openfile" data-v="${f.id}" style="min-height:38px;padding:4px 12px;font-size:.9em">فتح</button>${canUpload?`<button class="btn ghost" data-act="delfile" data-v="${f.id}" style="min-height:38px;padding:4px 12px;font-size:.9em;color:var(--bad)">حذف</button>`:""}</div></div></div>`).join("")}</div>`:`<p class="muted center" style="padding:16px">لا ملفات مرفقة بعد.</p>`}`;};

/* ——— مبادرة المحطات الصحية الذكية ——— */
const initRec=n=>{DB.initiative=DB.initiative||{};return DB.initiative[n]||{status:"todo",pct:0,note:"",d:""};};
const initAvg=()=>Math.round(INIT.stations.reduce((a,x)=>a+initRec(x.n).pct,0)/INIT.stations.length);
const Initiative=(edit=false)=>{const done=INIT.stations.filter(x=>initRec(x.n).status==="done").length;const avg=initAvg();const tab=S.itab||"plan";
 return `<section class="init-hero"><div class="row between" style="align-items:flex-start"><div><span class="badge" style="background:var(--card)">🩺 خطة المعلمة · ${esc(INIT.motto)}</span><h2 style="margin-top:8px">${INIT.name}</h2><span class="slg">🌸 ${INIT.slogan}</span></div>
  <div class="row" style="gap:16px">${Ring(avg,"var(--rose)","🩺")}<div><div style="font-family:var(--display);font-weight:800;font-size:1.1em">${done} من ${INIT.stations.length} محطات منجزة</div><div class="muted mini">متوسط الإنجاز ${avg}٪ على مدار العام</div></div></div></div></section>
 <div class="tabs" style="margin-top:14px">${[["about","📖 نبذة"],["plan","🗓️ الخطة التنفيذية والإنجاز"],["doc","📎 التوثيق والتقييم"],["end","🌷 الخاتمة"]].map(([k,t])=>`<button class="${tab===k?"on":""}" data-act="itab" data-v="${k}" style="${tab===k?"background:var(--rose)":""}">${t}</button>`).join("")}</div>
 ${tab==="about"?`<div class="grid g2"><div class="card">${INIT.about.map(p=>`<p style="margin-bottom:12px;line-height:1.9">🌿 ${p}</p>`).join("")}<div class="quote">لأن كل طالبة قادرة على أن تصنع أثرًا.. معًا نحو جيل أكثر صحة ووعيًا</div></div>
   <div class="infolist">${INIT.info.map(([i,k,v])=>`<div><span class="i">${i}</span><span class="k">${k}:</span><span class="v">${v}</span></div>`).join("")}</div></div>`:""}
 ${tab==="plan"?`<p class="muted" style="margin-bottom:10px">${edit?"لكل شهر محطة. حدّدي حالة المحطة ومقدار تقدّمها، واكتبي ما أُنجز ثم احفظي.":"محطة واحدة كل شهر — وأمام كل محطة مقدار التقدّم والإنجاز."}</p>
  <div class="initrail">${INIT.stations.map(x=>{const r=initRec(x.n);const [lbl,bg,fg]=INIT_STATUS[r.status];const col=r.status==="done"?"var(--ok)":r.status==="progress"?"var(--gold)":"var(--line)";
   return `<div class="st-card" style="--st:${col}"><div class="month"><b>${["١","٢","٣","٤","٥","٦","٧"][x.n-1]}</b><span>${x.month}</span></div>
    <div><div class="row" style="gap:8px"><span style="font-size:1.6em">${x.ic}</span><h4>${x.t}</h4><span class="stage" style="background:${bg};color:${fg}">${lbl}</span></div><div class="l"><b>النشاط والتنفيذ:</b> ${x.act}</div><div class="l"><b>المخرج:</b> ${x.out}</div>${r.note?`<div class="l" style="color:var(--teal)">✎ ${esc(r.note)}${r.d?` <span class="muted">· ${r.d}</span>`:""}</div>`:""}</div>
    <div class="st-prog">${edit?`<select id="is-${x.n}"><option value="todo" ${r.status==="todo"?"selected":""}>لم تبدأ</option><option value="progress" ${r.status==="progress"?"selected":""}>قيد التنفيذ</option><option value="done" ${r.status==="done"?"selected":""}>منجزة</option></select><div class="row" style="gap:8px;flex-wrap:nowrap"><input type="range" min="0" max="100" step="5" value="${r.pct}" id="ip-${x.n}" data-init="${x.n}"><b id="ipv-${x.n}" style="min-width:44px;text-align:center;font-variant-numeric:tabular-nums">${r.pct}٪</b></div><input type="text" id="in-${x.n}" value="${esc(r.note)}" placeholder="ما أُنجز في هذه المحطة…" style="padding:8px 10px"><button class="btn primary" data-act="initsave" data-v="${x.n}" style="min-height:40px;background:var(--rose)">حفظ</button>`
     :`${Bar(r.pct,"التقدّم")}${r.status==="done"?`<div class="st-done">✓ أُنجزت${r.d?" · "+r.d:""}</div>`:""}`}</div></div>`;}).join("")}</div>
  <div class="quote" style="margin-top:14px">${INIT.closing}</div>`:""}
 ${tab==="doc"?`<div class="grid g2"><div class="card"><h3>📊 ملخّص التقييم</h3><div class="grid g3" style="margin:10px 0"><div class="kpi"><div class="n">${done}</div><div class="muted mini">محطات منجزة</div></div><div class="kpi"><div class="n">${INIT.stations.filter(x=>initRec(x.n).status==="progress").length}</div><div class="muted mini">قيد التنفيذ</div></div><div class="kpi"><div class="n">${avg}٪</div><div class="muted mini">متوسط الإنجاز</div></div></div>
   <div class="grid" style="gap:8px">${INIT.stations.map(x=>{const r=initRec(x.n);return `<div class="row" style="gap:10px"><span style="width:26px">${x.ic}</span><div style="flex:1">${Bar(r.pct,x.t)}</div></div>`;}).join("")}</div></div>
  <div class="card"><h3>📎 توثيق المحطات</h3><p class="muted mini" style="margin:6px 0 10px">${edit?"اكتبي توثيق كل محطة (ما نُفّذ، الحضور، الأثر) واحفظي؛ وترفعين الصور والتقارير في «ملف الطالبة» لكل طالبة.":"ما وثّقته المعلمة لكل محطة."}</p><div class="feed">${INIT.stations.map(x=>{const r=initRec(x.n);return `<div class="note rose"><div class="row between mini"><b>${x.ic} ${x.t}</b><span class="stage" style="background:${INIT_STATUS[r.status][1]};color:${INIT_STATUS[r.status][2]}">${INIT_STATUS[r.status][0]} · ${r.pct}٪</span></div>${edit?`<div class="row" style="margin-top:6px"><input type="text" id="in-${x.n}" value="${esc(r.note)}" placeholder="توثيق المحطة…" style="flex:1;padding:8px 10px"><button class="btn primary" data-act="initsave" data-v="${x.n}" style="min-height:40px;background:var(--rose)">حفظ</button></div>`:`<div>${esc(r.note)||'<span class="muted">لم تُوثَّق بعد</span>'}</div>`}</div>`;}).join("")}</div></div></div>`:""}
 ${tab==="end"?`<div class="card" style="background:linear-gradient(180deg,var(--rose-soft),var(--card))"><h3 style="color:var(--rose);font-size:1.5em">🌷 خاتمة المبادرة</h3>${INIT.closingText.map(p=>`<p style="margin-top:12px;line-height:1.9">${p}</p>`).join("")}<div class="quote" style="margin-top:14px">معًا.. نحو مدارس أكثر صحة ووعيًا</div><div class="row" style="justify-content:center;gap:8px">${["صحة","وعي","معرفة","سلوك إيجابي","مستقبل أفضل"].map(t=>`<span class="badge" style="background:var(--card)">♥ ${t}</span>`).join("")}</div></div>`:""}`;};

/* ——— الخطة التربوية الفردية ——— */
const stName=id=>(PLAN_TEMPLATE.find(t=>t.id===id)||{}).t||"—";
const stPct=(sid,id)=>((DB.plan[sid]||{})[id]||{pct:0}).pct;
const IEP=(sid,edit)=>{const s=stu(sid);const p=DB.iep[sid]||{strengths:"",needs:"",long:[],short:[]};const goalRow=(g,kind,i)=>`<div class="soft iep-goal"><div><b>${esc(g.t)}</b><div class="mini muted">المسؤول: ${esc(g.by)} · الموعد: ${esc(g.due||"—")}</div></div><div class="mini">🛤️ ${stName(g.st)}</div><div>${Bar(stPct(sid,g.st))}</div><div class="mini" style="text-align:center"><b style="color:var(--teal)">${stPct(sid,g.st)}٪</b> ${stPct(sid,g.st)>=85?'<span class="stage" style="background:var(--ok-soft);color:var(--ok)">تحقّق</span>':""}</div>${edit?`<button class="badge" data-act="iepdel" data-v="${kind}:${i}">🗑</button>`:"<span></span>"}</div>`;
 const addRow=kind=>edit?`<div class="soft" style="margin-top:8px;border:2px dashed var(--line)"><div class="row"><input type="text" id="iep-${kind}-t" placeholder="اكتبي الهدف ${kind==="long"?"طويل":"قصير"} المدى…" style="flex:2;min-width:200px"><select id="iep-${kind}-st" style="width:auto">${PLAN_TEMPLATE.map(t=>`<option value="${t.id}">${t.ic} ${t.t}</option>`).join("")}</select><input type="text" id="iep-${kind}-by" placeholder="المسؤول" style="width:130px"><input type="text" id="iep-${kind}-due" placeholder="الموعد" style="width:130px"><button class="btn primary" data-act="iepadd" data-v="${kind}" style="min-height:44px">إضافة</button></div></div>`:"";
 return `<div class="card"><div class="row between"><div><h3 style="font-size:1.4em">📋 الخطة التربوية الفردية — ${s.name}</h3><span class="muted mini">ترتبط كل هدفٍ بمحطةٍ من محطات الرحلة، فيتحدّث تقدّمه تلقائيًا</span></div><div class="row">${DB.planApproved[sid]?`<span class="badge" style="background:var(--ok-soft);color:var(--ok)">✓ معتمدة</span>`:""}<button class="btn line" data-act="iepprint" style="min-height:44px">🖨️ طباعة</button></div></div>
  <div class="grid g2" style="margin-top:12px"><div><b>💪 نقاط القوة</b>${edit?`<textarea id="iep-s" rows="3">${esc(p.strengths)}</textarea>`:`<p class="soft">${esc(p.strengths)||"—"}</p>`}</div><div><b>🎯 الاحتياجات</b>${edit?`<textarea id="iep-n" rows="3">${esc(p.needs)}</textarea>`:`<p class="soft">${esc(p.needs)||"—"}</p>`}</div></div>
  ${edit?`<button class="btn primary" data-act="iepsave" style="margin-top:8px">حفظ نقاط القوة والاحتياجات</button>`:""}
  <h3 style="margin:18px 0 8px">🏁 الأهداف طويلة المدى</h3><div class="iepgrid">${(p.long||[]).map((g,i)=>goalRow(g,"long",i)).join("")||'<p class="muted">لا أهداف بعد.</p>'}</div>${addRow("long")}
  <h3 style="margin:18px 0 8px">🚩 الأهداف قصيرة المدى</h3><div class="iepgrid">${(p.short||[]).map((g,i)=>goalRow(g,"short",i)).join("")||'<p class="muted">لا أهداف بعد.</p>'}</div>${addRow("short")}</div>`;};
const printIEP=sid=>{const s=stu(sid),p=DB.iep[sid]||{long:[],short:[]};const el=document.getElementById("print");el.innerHTML=`<div class="row"><b>أجنحة الأمل · معاهد وبرامج التربية الفكرية</b><b>${today()}</b></div><h1>الخطة التربوية الفردية — ${esc(s.name)}</h1><p><b>نقاط القوة:</b> ${esc(p.strengths||"")}</p><p><b>الاحتياجات:</b> ${esc(p.needs||"")}</p><h2>الأهداف طويلة المدى</h2><ol>${(p.long||[]).map(g=>`<li><span class="box">${stPct(sid,g.st)>=85?"✓":""}</span><span>${esc(g.t)} — ${stName(g.st)} — ${stPct(sid,g.st)}٪ — ${esc(g.by)} — ${esc(g.due||"")}</span></li>`).join("")}</ol><h2>الأهداف قصيرة المدى</h2><ol>${(p.short||[]).map(g=>`<li><span class="box">${stPct(sid,g.st)>=85?"✓":""}</span><span>${esc(g.t)} — ${stName(g.st)} — ${stPct(sid,g.st)}٪ — ${esc(g.by)} — ${esc(g.due||"")}</span></li>`).join("")}</ol><h2>محطات المتابعة</h2><ol>${PLAN_TEMPLATE.map(t=>`<li><span class="ico">${t.ic}</span><span>${t.t}: ${stPct(sid,t.id)}٪</span></li>`).join("")}</ol><p class="sig">المعلمة: نسيم عكام ____ · وكيلة الشؤون التعليمية: رضية صباغ ____ · المديرة: عفاف صباغ ____ · ولي الأمر: ____</p>`;setTimeout(()=>window.print(),80);};
/* ——— تقرير الأسبوع للأسرة ——— */
const topMoods=sid=>{const m={};(DB.moods[sid]||[]).slice(-10).forEach(x=>m[x.e+" "+x.t]=(m[x.e+" "+x.t]||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,3);};
const WeekReport=sid=>{const s=stu(sid);const rt=DB.ratings[sid]||{};const lastNote=[...(DB.notes[sid]||[]),...(DB.comments[sid]||[])].slice(-1)[0];const badges=(DB.activities[sid]||[]).slice(-3);return `<div class="card" style="background:linear-gradient(160deg,var(--rose-soft),var(--card) 60%,var(--gold-soft));border-color:var(--rose)"><div class="row between"><div class="row">${Avatar(s,64)}<div><h3 style="font-size:1.4em;color:var(--rose)">🌸 تقرير الأسبوع — ${s.name}</h3><span class="muted mini">${today()} · أجنحة الأمل</span></div></div><button class="btn line" data-act="weekprint" style="min-height:44px">🖨️ طباعة / حفظ</button></div>
 <div class="grid g3" style="margin-top:14px"><div class="kpi"><div class="n">${lessonsDone(sid)}/${LESSONS.length}</div><div class="muted mini">دروس أنهتها</div></div><div class="kpi"><div class="n">⭐ ${DB.stars[sid]||0}</div><div class="muted mini">مجموع النجوم</div></div><div class="kpi"><div class="n">${planAvg(sid)}٪</div><div class="muted mini">خطة المتابعة</div></div></div>
 <div class="grid g2" style="margin-top:12px"><div class="soft"><b>😊 مشاعرها هذا الأسبوع</b><div class="row" style="margin-top:6px">${topMoods(sid).map(([k,n])=>`<span class="badge" style="background:var(--card)">${k} ×${n}</span>`).join("")||'<span class="muted mini">لا تسجيلات</span>'}</div></div><div class="soft"><b>🏅 شاراتها</b><div class="row" style="margin-top:6px">${badges.map(b=>`<span class="badge" style="background:var(--card)">${b.badge}</span>`).join("")||'<span class="muted mini">—</span>'}</div></div></div>
 <div class="soft" style="margin-top:10px"><b>⭐ تقييمات المعلمة</b><div class="row" style="margin-top:6px">${LESSONS.filter(l=>rt[l.id]).slice(-4).map(l=>`<span class="badge" style="background:var(--card)">${l.icon} ${l.title} ${"⭐".repeat(rt[l.id].stars)}</span>`).join("")||'<span class="muted mini">—</span>'}</div></div>
 ${lastNote?`<div class="note gold" style="margin-top:10px"><b>💬 ${esc(lastNote.by)}:</b> ${esc(lastNote.t)}</div>`:""}
 <div class="quote" style="margin-top:10px;font-size:1.2em">من فكرة صغيرة نصنع أثرًا كبيرًا 🌷</div></div>`;};
const printWeek=sid=>{const s=stu(sid);const rt=DB.ratings[sid]||{};const el=document.getElementById("print");el.innerHTML=`<div class="row"><b>أجنحة الأمل</b><b>${today()}</b></div><h1>🌸 تقرير الأسبوع — ${esc(s.name)}</h1><ol><li><span class="ico">📚</span><span>دروس أنهتها: ${lessonsDone(sid)} من ${LESSONS.length}</span></li><li><span class="ico">⭐</span><span>مجموع النجوم: ${DB.stars[sid]||0}</span></li><li><span class="ico">🛤️</span><span>خطة المتابعة: ${planAvg(sid)}٪</span></li><li><span class="ico">😊</span><span>مشاعرها: ${topMoods(sid).map(([k,n])=>k+" ×"+n).join("، ")||"—"}</span></li>${LESSONS.filter(l=>rt[l.id]).map(l=>`<li><span class="ico">${l.icon}</span><span>${l.title}: ${"★".repeat(rt[l.id].stars)}${"☆".repeat(5-rt[l.id].stars)} — ${esc(rt[l.id].t)}</span></li>`).join("")}</ol><p class="sig">مع تحيات فريق أجنحة الأمل · المعلمة نسيم عكام</p>`;setTimeout(()=>window.print(),80);};
/* ——— خريطة ABC ——— */
const ABCHeat=sid=>{const arr=DB.abc[sid]||[];if(!arr.length)return "";const days=["أحد","اثنين","ثلاثاء","أربعاء","خميس"];const hours=[7,8,9,10,11,12];const cnt={};arr.forEach(r=>{cnt[r.dow+":"+r.h]=(cnt[r.dow+":"+r.h]||0)+1;});const mx=Math.max(1,...Object.values(cnt));return `<h4 style="margin:12px 0 6px;font-family:var(--display)">🔥 متى يتكرّر التوتر؟</h4><div class="heat" style="grid-template-columns:60px repeat(${hours.length},1fr)"><div class="h"></div>${hours.map(h=>`<div class="h">${h}</div>`).join("")}${days.map((d,di)=>`<div class="h">${d}</div>${hours.map(h=>{const n=cnt[di+":"+h]||0;return `<div style="background:${n?`rgba(228,120,143,${.25+.75*n/mx})`:"var(--card2)"};color:${n/mx>.6?"#fff":"inherit"}">${n||""}</div>`;}).join("")}`).join("")}</div>`;};

/* المعلمة */
V.t_home=()=>{const sid=S.cs,s=stu(sid);let panel="";
 if(S.tab==="progress")panel=ProgressPanel(sid);
 else if(S.tab==="rate")panel=`<p class="muted" style="margin-bottom:12px">قيّمي أداء ${s.short} في كل درسٍ بالنجوم واكتبي تعليقًا قصيرًا تراه الطالبة وولي أمرها.</p><div class="grid">${LESSONS.map(l=>{const r=(DB.ratings[sid]||{})[l.id]||{stars:0,t:""};return `<div class="card" style="padding:14px"><div class="row between"><b>${l.icon} ${l.title}</b>${Stars(r.stars,{ro:false,act:"rate:"+l.id})}</div><div class="row" style="margin-top:8px"><input type="text" id="rt-${l.id}" value="${esc(r.t)}" placeholder="تعليق المعلمة…" style="flex:1"><button class="btn primary" data-act="ratesave" data-v="${l.id}" style="min-height:48px">حفظ</button></div></div>`;}).join("")}</div>`;
 else if(S.tab==="notes")panel=`<div class="card" style="margin-bottom:14px"><h3>✍️ ملاحظة متابعة</h3><div class="row" style="margin-top:8px"><select id="ncat" style="width:auto">${NOTE_CATS.map(c=>`<option>${c}</option>`).join("")}</select><input type="text" id="ninp" placeholder="اكتبي ملاحظتكِ عن ${s.short}…" style="flex:1"></div><button class="btn primary" data-act="addnote" style="margin-top:10px">إضافة الملاحظة</button></div>
  <h3 style="margin-bottom:8px">ملاحظات الفريق</h3>${NoteList(DB.notes[sid]||[])}
  <h3 style="margin:18px 0 8px">🏠 ملاحظات ولي الأمر</h3>${NoteList(DB.parentNotes[sid]||[],"gold")}`;
 else if(S.tab==="goals")panel=`<div class="card" style="margin-bottom:14px"><h3>🎯 هدف جديد</h3><div class="row" style="margin-top:8px"><input type="text" id="ginp" placeholder="مثال: إتمام درس الإحرام هذا الأسبوع" style="flex:1"><button class="btn primary" data-act="addgoal">إضافة</button></div></div><div class="grid">${(DB.goals[sid]||[]).map((g,i)=>`<div class="soft row between"><b>🎯 ${esc(g.t)}</b><span class="badge">${esc(g.d)}</span></div>`).join("")}</div>`;
 else if(S.tab==="plan")panel=`<p class="muted" style="margin-bottom:12px">حرّكي المؤشّر أمام كل محطة لتحديد مقدار تقدّم ${s.short}، واكتبي ملاحظة إن شئتِ ثم احفظي. تراها الأسرة والوكيلة والمديرة.</p>${Journey(sid,{mode:"edit"})}`;
 else if(S.tab==="files")panel=FilesBox(sid,{canUpload:true});
 else if(S.tab==="craft")panel=CraftTeacher(sid);
 else if(S.tab==="init")panel=Initiative(true);
 else if(S.tab==="iep")panel=IEP(sid,true);
 else if(S.tab==="commset")panel=`<p class="muted" style="margin-bottom:12px">ارفعي صورًا حقيقية للأشخاص الذين تعرفهم الطالبات لتظهر في لوحة «أريد أن أقول» بدل الرموز — الوجوه الحقيقية أسهل فهمًا لطالباتنا.</p><div class="grid g3">${COMM_PAGES.people.items.filter(x=>x.k).map(x=>{const ph=DB.people[x.k];return `<div class="card center" style="padding:14px">${ph?`<img src="${ph.data}" class="ph" style="width:96px;height:96px;border-radius:50%;object-fit:cover">`:`<div style="font-size:3.5em">${x.e}</div>`}<b style="display:block;margin:6px 0">${x.t}</b><label class="btn ghost" style="cursor:pointer;min-height:42px">📷 ${ph?"تغيير":"رفع صورة"}<input type="file" accept="image/*" hidden data-person="${x.k}"></label>${ph?`<button class="badge" data-act="delperson" data-v="${x.k}" style="margin-top:6px">🗑 حذف</button>`:""}</div>`;}).join("")}</div>
  <h3 style="margin:18px 0 8px">🗣️ ما قالته ${s.short} اليوم</h3>${SaidList(sid,false)}`;
 else if(S.tab==="msg")panel=`<div class="card"><h3>💌 رسالة تشجيع تسمعها ${s.short} عند دخولها</h3><p class="muted mini" style="margin:6px 0 10px">الرسالة الحالية: <b>${esc((DB.messages[sid]||{}).text||"—")}</b></p><div class="grid g3">${["أنا فخورةٌ بكِ!","أحسنتِ، استمرّي يا بطلة!","نحبكِ ونثق بكِ 💚"].map(t=>`<button class="pill" data-act="msg" data-v="${esc(t)}">${t}</button>`).join("")}</div><div class="row" style="margin-top:10px"><input type="text" id="minp" placeholder="أو اكتبي رسالتكِ…" style="flex:1"><button class="btn primary" data-act="msgcustom">إرسال</button></div></div>
  <h3 style="margin:18px 0 8px">🗣️ ما قالته ${s.short} عبر لوحة التواصل</h3>${SaidList(sid,false)}
  <div style="margin-top:16px"><button class="btn gold" data-act="preview">👀 معاينة واجهة الطالبة</button></div>`;
 const dir=DB.directives.slice(-1)[0];
 return `<div class="fade">${StaffTop()}${dir?`<div class="note gold" style="margin-bottom:14px">📣 <b>توجيه الوكيلة ${esc(dir.by)}:</b> ${esc(dir.t)} <span class="muted mini">· ${dir.d}</span></div>`:""}<h2 style="margin-bottom:10px">طالباتي</h2>${StudentPicker()}
 <div class="card" style="padding:18px"><div class="row" style="margin-bottom:12px">${Avatar(s,56)}<h2 style="font-size:1.5em">${s.name}</h2></div>
 ${Tabs([["progress","📈 التقدّم"],["plan","🛤️ خطة المتابعة"],["rate","⭐ التقييم بالنجوم"],["files","📁 ملف الطالبة"],["notes","📝 الملاحظات"],["goals","🎯 الأهداف"],["craft","🌸 صنّاع الأثر"],["init","🩺 المحطات الصحية"],["iep","📋 الخطة الفردية"],["commset","🗣️ لوحة التواصل"],["msg","💌 رسالة ومعاينة"]])}${panel}</div>${Footer()}</div>`;};

const SaidList=(sid,canReply)=>{const arr=DB.said[sid]||[];return arr.length?`<div class="feed">${arr.slice().reverse().map((x,ri)=>{const i=arr.length-1-ri;return `<div class="msg"><div class="who"><span style="font-size:1.4em">${x.e}</span><b>${esc(x.t)}</b><span class="muted mini">${x.d}</span></div>${x.reply?`<div class="note ok" style="margin-top:4px">💬 <b>${esc(x.reply.by)}</b>: ${esc(x.reply.t)}</div>`:canReply?`<div class="row"><input type="text" id="rp-${i}" placeholder="ردّ المديرة على الطالبة…" style="flex:1"><button class="btn primary" data-act="reply" data-v="${i}" style="min-height:44px">ردّ</button></div>`:""}</div>`;}).join("")}</div>`:`<p class="muted">لم تستخدم لوحة التواصل بعد.</p>`;};

/* ولي الأمر */

 else if(S.tab==="plan")panel=Journey(sid)+`<h3 style="margin:18px 0 8px">🎨 مشاركاتها في الأنشطة</h3><div class="grid g3">${(DB.activities[sid]||[]).map(a=>`<div class="badgecard on"><span class="e">${a.badge.split(" ")[0]}</span><b>${esc(a.badge.slice(a.badge.indexOf(" ")+1))}</b><span class="mini muted">${esc(a.t)} · ${a.d}</span></div>`).join("")||'<p class="muted">لا مشاركات مسجّلة بعد.</p>'}</div>`;
 else if(S.tab==="files")panel=FilesBox(sid);
 else if(S.tab==="week")panel=WeekReport(sid)+`<div class="card" style="margin-top:14px"><h3>🏠 مكافأة المنزل</h3><p class="muted mini" style="margin:6px 0 10px">ما المكافأة التي تنتظر ${s.short} في البيت عند جمعها ${REWARD_TARGET} نجوم؟ تراها الطالبة بجانب مكافأة المدرسة.</p><div class="row"><input type="text" id="hrw" value="${esc((DB.reward[sid]||{}).home||"")}" placeholder="مثال: نزهة يوم الجمعة" style="flex:1"><button class="btn primary" data-act="homereward">حفظ</button></div></div>`;
 else if(S.tab==="health")panel=`<h3 style="margin-bottom:8px">🩺 توجيهات صحية خاصة بـ${s.short}</h3>${NoteList(DB.health[sid]||[],"sky")}<h3 style="margin:18px 0 8px">📰 نشرات الرائدة الصحية</h3>${Bulletins()}`;
 return `<div class="fade">${StaffTop()}<div class="card"><div class="row" style="margin-bottom:12px">${Avatar(s,64)}<div><h2 style="font-size:1.5em">${s.name}</h2><span class="muted">ابنتكم الغالية — نتابع معكم خطوةً بخطوة</span></div></div>

 <div class="grid g2"><div class="card"><h3>✨ تسجيل مشاركة لـ${s.short}</h3><input type="text" id="ainp" placeholder="اسم النشاط أو المبادرة — مثال: المحطات الصحية الذكية" style="margin-top:8px"><p class="muted mini" style="margin:10px 0 6px">اختاري الشارة التي تستحقّها:</p><div class="grid g3">${ACTIVITY_BADGES.map((b,i)=>`<button class="badgecard ${S.sel===i?"on":""}" data-act="badge" data-v="${i}"><span class="e">${b.e}</span><b class="mini">${b.t}</b></button>`).join("")}</div><button class="btn primary wide" data-act="addact" style="margin-top:12px">حفظ المشاركة ومنح الشارة 🏅</button>

const Bulletins=(edit=false)=>`<div class="grid g2">${DB.bulletins.map(b=>`<article class="bulletin" style="background:${b.bg}"><div class="row between"><span class="badge" style="background:rgba(255,255,255,.7)">${esc(b.cat)}</span><span style="font-size:2em">${b.icon}</span></div><h3>${esc(b.title)}</h3><p>${esc(b.body)}</p><div class="row between mini" style="opacity:.75"><span>${esc(b.by)}</span>${edit?`<button class="badge" data-act="delb" data-v="${b.id}">🗑 حذف</button>`:`<button class="badge" data-act="say" data-say="${esc(b.title)}. ${esc(b.body)}">🔊</button>`}</div></article>`).join("")}</div>`;

  <h3 style="margin:18px 0 8px">🏠 إنجازات ${s.short} في المنزل</h3><div class="row">${ACTIVITIES.map(a=>{const v=(DB.home[sid]||{})[a.id];return `<span class="badge">${a.emoji} ${a.title}: ${v==="alone"?"💪 وحدها":v==="help"?"🤝 بمساعدة":"⏳"}</span>`;}).join("")}</div>`;

  case "msgcustom":{const t=val("minp");if(!t)break;DB.messages[S.cs]={text:t,by:S.staff.name};save();toast("أُرسلت الرسالة 💌");render();break;}
  case "preview":S.preview=true;S.previewRet="t_home";S.me=stu(S.cs);S.mood=null;go("hub");break;
  case "home":{const [aid,lvl]=v.split(":");DB.home[S.cs]=DB.home[S.cs]||{};DB.home[S.cs][aid]=lvl;save();render();break;}
  case "addparent":{const t=val("pinp");if(!t){toast("اكتب ملاحظتك أولًا");break;}push(DB.parentNotes,S.cs,{t,by:S.staff.name,d:today()});toast("أُرسلت للمدرسة ✅");render();break;}
  case "addhealth":{const t=val("hinp");if(!t)break;push(DB.health,S.cs,{cat:val("hcat"),t,d:today()});toast("حُفظ التوجيه");render();break;}
  case "addb":{const title=val("btitle"),body=val("bbody");if(!title||!body){toast("العنوان والنص مطلوبان");break;}const bgs=["#DDEFEC","#FBEEDA","#FBE3EA","#E1ECF9","#EDE6F8","#DDF1E6"];DB.bulletins.push({id:"b"+Date.now(),cat:val("bcat"),icon:val("bicon")||"💡",title,body,by:S.staff.name,bg:bgs[DB.bulletins.length%bgs.length]});save();toast("نُشرت النشرة 📰");render();break;}
  case "delb":DB.bulletins=DB.bulletins.filter(x=>x.id!==v);save();render();break;
  case "pevalsave":{const cur=DB.principalEval[S.cs]||{stars:0};DB.principalEval[S.cs]={stars:cur.stars,t:val("pevt")};save();toast("حُفظ التقييم 🏅");render();break;}
  case "addcomment":{const t=val("cinp");if(!t)break;push(DB.comments,S.cs,{by:S.staff.name,role:ROLE_AR[S.role],t,d:today()});toast("أُضيف التعليق");render();break;}
  case "reply":{const t=val("rp-"+v);if(!t)break;DB.said[S.cs][v].reply={by:S.staff.name,t};save();toast("أُرسل الردّ للطالبة 💬");render();break;}
  default:if(act.startsWith("rate:")){const lid=act.slice(5);DB.ratings[S.cs]=DB.ratings[S.cs]||{};const r=DB.ratings[S.cs][lid]||{t:""};DB.ratings[S.cs][lid]={stars:+v,t:document.getElementById("rt-"+lid)?.value.trim()??r.t,by:S.staff.name};save();tone("tap");render();}
   else if(act==="peval"){const cur=DB.principalEval[S.cs]||{t:""};DB.principalEval[S.cs]={stars:+v,t:document.getElementById("pevt")?.value.trim()??cur.t};save();tone("tap");render();}
 }});

/* رفع الملفات إلى صندوق الطالبة */
const addFiles=(list)=>{const files=[...list].filter(f=>f.type.startsWith("image/")||f.type==="application/pdf");if(!files.length){toast("يُقبل الصور وملفات PDF فقط");return;}
 const cat=val("fcat")||FILE_CATS[0];let pending=files.length;
 files.forEach(f=>{if(f.size>3*1024*1024){toast(`«${f.name}» أكبر من ٣ م.ب`);if(--pending===0)render();return;}
  const r=new FileReader();r.onload=()=>{DB.files[S.cs]=DB.files[S.cs]||[];DB.files[S.cs].push({id:"f"+Date.now()+Math.random().toString(36).slice(2,6),name:f.name,type:f.type,size:f.size,data:r.result,cat,by:S.staff.name,d:today()});
   try{localStorage.setItem(KEY,JSON.stringify(DB));toast("أُرفق الملف 📎");}catch(e){DB.files[S.cs].pop();toast("مساحة التخزين على هذا الجهاز ممتلئة — احذفي ملفات قديمة");}
   if(--pending===0)render();};r.readAsDataURL(f);});};
document.addEventListener("change",e=>{const sp=e.target.dataset&&e.target.dataset.skillphoto;if(sp&&e.target.files[0]){const f=e.target.files[0];const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,640/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=img.width*k;cv.height=img.height*k;cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);const data=cv.toDataURL("image/jpeg",.7);const a=ACTIVITIES.find(x=>x.id==sp);DB.files[S.me.id]=DB.files[S.me.id]||[];DB.files[S.me.id].push({id:"f"+Date.now(),name:`إنجاز ${a.title} — ${today()}.jpg`,type:"image/jpeg",size:Math.round(data.length*.75),data,cat:"صورة إنجاز",by:S.me.name,d:today()});save();award(2);confetti();tone("win");speak(`صورةٌ جميلة يا ${S.me.short}! أنتِ بطلة`);go("skills");};img.src=rd.result;};rd.readAsDataURL(f);return;}
 const pp=e.target.dataset&&e.target.dataset.person;if(pp&&e.target.files[0]){const f=e.target.files[0];const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,240/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=img.width*k;cv.height=img.height*k;cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);DB.people[pp]={data:cv.toDataURL("image/jpeg",.7)};save();toast("حُفظت الصورة 📷");render();};img.src=rd.result;};rd.readAsDataURL(f);return;}
 if(e.target.id==="fileinp")addFiles(e.target.files);if(e.target.id==="voicepick"){UI.voice=e.target.value;saveUI();speak("أهلًا بكنّ في أجنحة الأمل");}});
document.addEventListener("input",e=>{if(e.target.dataset.init){const l=document.getElementById("ipv-"+e.target.dataset.init);if(l)l.textContent=e.target.value+"٪";}const pid=e.target.dataset.plan;if(pid){const st=e.target.closest(".station")||e.target.closest(".row");const ring=st?.querySelector(".ring");if(ring){const c=2*Math.PI*30;const arc=ring.querySelectorAll("circle")[1];if(arc)arc.setAttribute("stroke-dashoffset",c*(1-e.target.value/100));const p=ring.querySelector(".pct");if(p)p.textContent=e.target.value+"٪";}}});
document.addEventListener("dragover",e=>{const dz=e.target.closest("#dz");if(dz){e.preventDefault();dz.classList.add("over");}});
document.addEventListener("dragleave",e=>{const dz=e.target.closest("#dz");if(dz)dz.classList.remove("over");});
document.addEventListener("drop",e=>{const dz=e.target.closest("#dz");if(dz){e.preventDefault();dz.classList.remove("over");addFiles(e.dataTransfer.files);}});

function render(){const app=document.getElementById("app");const fn=V[S.screen]||V.landing;app.innerHTML=fn();
 const stuScreens=["mood","hub","lesson","ldone","activity","comm","mystars","journey","reward","skills","skill"];
 if(S.me&&stuScreens.includes(S.screen)&&!document.getElementById("calmbtn")){const b=document.createElement("button");b.id="calmbtn";b.className="calmbtn";b.dataset.act="calm";b.title="ركن الهدوء";b.setAttribute("aria-label","ركن الهدوء");b.textContent="🕊️";document.body.appendChild(b);}
 else if(!(S.me&&stuScreens.includes(S.screen))){document.getElementById("calmbtn")?.remove();}
 if(UI.clear)stripTashkeel(app);
 if(UI.scan&&S.me&&stuScreens.includes(S.screen))setTimeout(scanStart,50);else scanStop();}
render();fx();
</script>
