html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:calc(17px*var(--fs));line-height:1.6;direction:rtl;-webkit-font-smoothing:antialiased}

button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--gold);outline-offset:3px;border-radius:12px}
h1,h2,h3{font-family:var(--display);line-height:1.25;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px;padding-inline:18px;min-height:100%}
.narrow{max-width:760px}
.center{text-align:center}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);border:1px solid var(--line)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:18px;padding:14px 22px;font-weight:800;font-family:var(--display);font-size:1.05em;min-height:56px;transition:transform .12s,box-shadow .12s;text-align:center}

.btn.gold{background:var(--gold);color:#3A2600}
.btn.ghost{background:var(--card2);color:var(--ink)}
.btn.line{border:2px solid var(--line);background:var(--card)}
.btn.big{font-size:1.5em;min-height:82px;padding:18px 30px;border-radius:26px;width:100%}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding:10px 0;margin-bottom:14px}
.avatar{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.track{height:16px;border-radius:999px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
.fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal),var(--ok));transition:width .6s}
.stars{display:inline-flex;gap:4px;font-size:1.4em;direction:ltr}
.stars button{padding:2px;line-height:1;filter:grayscale(1);opacity:.45;transition:transform .1s}
.stars button.on{filter:none;opacity:1}
.stars button:hover{transform:scale(1.15)}
.stars.ro button{cursor:default}
textarea,input[type=text],select{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.note{border-inline-start:5px solid var(--teal);background:var(--card2);border-radius:12px;padding:10px 14px}

.tile{background:var(--card);border-radius:var(--r);padding:18px;border:2px solid var(--line);text-align:center;transition:transform .14s,border-color .14s;position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:150px;justify-content:center}

.opt.bad{background:var(--bad-soft);border-color:var(--bad);animation:shake .34s}

.dots{display:flex;justify-content:center;gap:10px;margin-bottom:18px}
.dot{height:12px;width:12px;border-radius:999px;background:var(--line);transition:all .3s}

.stu{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);background:var(--card);border:2px solid var(--line);width:100%;text-align:start;transition:transform .12s,border-color .12s}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

.feed{display:flex;flex-direction:column;gap:10px}
.msg{background:var(--card2);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}

.bulletin{border-radius:var(--r);padding:20px;color:#1E2C31;display:flex;flex-direction:column;gap:8px;border:1px solid rgba(0,0,0,.05)}

.celebrate{text-align:center;padding:30px 10px}
.celebrate .big{font-size:5em;line-height:1;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}

.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}

.sched{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}

.sched div.now{box-shadow:0 0 0 3px var(--gold);background:var(--gold-soft)} .sched div.done{background:var(--ok-soft)} .sched div.next{opacity:.5}
.a11y{display:flex;gap:6px;flex-wrap:wrap}

.speak{display:inline-flex;align-items:center;gap:6px;background:var(--teal-soft);color:var(--teal);border-radius:999px;padding:6px 14px;font-weight:800}
.hadith{background:var(--gold-soft);border:2px dashed var(--gold);border-radius:20px;padding:18px 20px;font-family:var(--display);font-size:1.3em;line-height:1.9;text-align:center;color:var(--ink)}

.footer{margin-top:30px;text-align:center;color:var(--muted);font-size:.85em}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:999px;font-weight:800;z-index:60;box-shadow:var(--shadow);animation:fade .3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.opt{font-size:1.15em;min-height:80px;padding:16px}.btn.big{font-size:1.25em}.hero-text{padding:20px 16px}}

 seq.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type=kind==="bad"?"triangle":"sine";o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=c.currentTime+i*.09;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.45);o.start(t);o.stop(t+.5);});}catch(e){}};

 <h2 style="font-size:1.6em;margin-bottom:4px">دروسي 📚 <button class="speak" data-act="say" data-say="اختاري درسًا يا ${me.short}">🔊</button></h2><p class="muted" style="margin-bottom:14px">المسي الدرس لتبدئي — ${lessonsDone(me.id)} من ${LESSONS.length} دروس مكتملة</p>
 ${Bar(progressOf(me.id))}
 <div class="grid g3" style="margin-top:14px">${LESSONS.map(l=>{const d=done[l.id];return `<button class="tile ${d?"done":""}" data-act="lesson" data-v="${l.id}" style="border-color:${d?"var(--ok)":l.accent};background:${d?"var(--card)":l.soft}">${d?`<span class="tick">✓</span>`:""}<span class="badge" style="position:absolute;top:10px;inset-inline-end:12px">${l.n}</span><span class="ic">${l.icon}</span><span class="t">${l.title}</span>${d?`<span class="mini muted">${d.score}/${d.max} ⭐</span>`:""}</button>`;}).join("")}</div>
 <h2 style="font-size:1.4em;margin:26px 0 10px">أنشطتي 🌼</h2>
 <div class="grid g3">
  <button class="tile" data-act="go" data-v="activity" style="background:var(--teal-soft)"><span class="ic">🪥</span><span class="t">روتيني اليومي</span></button>
  <button class="tile" data-act="go" data-v="comm" style="background:var(--rose-soft)"><span class="ic">🗣️</span><span class="t">أريد أن أقول</span></button>
  <button class="tile" data-act="go" data-v="mystars" style="background:var(--gold-soft)"><span class="ic">🏆</span><span class="t">نجومي</span></button>
 </div></div>`;};

/* ——— الدرس ——— */
const LessonTop=(l)=>Top(`<span class="badge" style="background:var(--gold-soft);color:var(--gold-ink)">⭐ ${DB.stars[S.me.id]||0}</span><button class="iconbtn" data-act="go" data-v="hub" aria-label="رجوع للقائمة">✕</button>`,`<div class="row"><span style="font-size:1.8em">${l.icon}</span><b style="font-size:1.2em">${l.title}</b></div>`);
const steps=["read","explore","mcq","tf","match"];
V.lesson=()=>{const l=S.lesson;const si=steps.indexOf(S.step);let body="";
 if(S.step==="read"){body=`<div class="card center" style="border-color:${l.accent}"><div style="font-size:4.5em;line-height:1">${l.icon}</div><h2 style="font-size:2em;margin:8px 0">${l.title}</h2>
  <div class="row" style="justify-content:center;margin-bottom:14px">${l.facts.map(f=>`<span class="badge" style="font-size:1em">${f.e} ${f.t}</span>`).join("")}</div>
  <p style="font-size:1.25em;max-width:60ch;margin:auto">${l.intro}</p>
  <div style="margin:16px auto 0;max-width:60ch" class="hadith">${l.hadith}</div>
  <div class="row" style="justify-content:center;margin-top:16px"><button class="btn gold" data-act="say" data-say="${esc(l.intro)}">🔊 اسمعي الدرس</button><button class="btn line" data-act="say" data-say="${esc(l.hadith)}">🔊 اسمعي النص</button></div>
  <div style="margin-top:22px"><button class="btn primary big" data-act="step" data-v="explore">التالي: الصور والإشارات ▶</button></div></div>`;}
 else if(S.step==="explore"){body=`<h2 class="center" style="font-size:1.6em">المسي الصورة لتسمعي 👆🔊</h2><p class="center muted" style="margin-bottom:16px">تعرّفي على كلماتِ الدرس بالصور والإشارات — ${S.said.size} من ${l.pictos.length}</p>
  <div class="grid g3">${l.pictos.map((p,i)=>`<button class="picto ${S.said.has(i)?"said":""}" data-act="picto" data-v="${i}"><span class="ic">${p.e}</span><span class="lbl">${p.t}</span><span class="spk">${S.said.has(i)?"✓ سمعتِها":"🔊 المسي"}</span></button>`).join("")}</div>
  <div style="margin-top:22px;max-width:520px;margin-inline:auto"><button class="btn primary big" data-act="step" data-v="mcq" ${S.said.size<Math.min(3,l.pictos.length)?"disabled style='opacity:.5'":""}>${S.said.size<3?"المسي ثلاث صور على الأقل":"جاهزة للأسئلة ▶"}</button></div>`;}
 else if(S.step==="mcq"){const q=l.mcq[S.qi];body=`${Dots(l.mcq.length,S.qi)}<div class="card center" style="border-color:${l.accent}"><span class="badge">سؤال ${S.qi+1} من ${l.mcq.length}</span><h2 style="font-size:1.8em;margin:12px 0">${q.q} <button class="speak" data-act="say" data-say="${esc(q.q)}">🔊</button></h2>
  <div class="grid g2" style="margin-top:14px">${S.order.map(i=>{const o=q.opts[i];return `<button class="opt ${S.wrong===i?"bad":""}" data-act="mcq" data-v="${i}"><span style="font-size:1.6em">${o.e||""}</span>${o.t}</button>`;}).join("")}</div></div>`;}
 else if(S.step==="tf"){const t=l.tf[S.ti];body=`${Dots(l.tf.length,S.ti)}<div class="card center" style="border-color:${l.accent}"><span class="badge">صحيح أم خطأ؟ ${S.ti+1} من ${l.tf.length}</span><h2 style="font-size:1.6em;margin:14px 0;line-height:1.7">${t.s} <button class="speak" data-act="say" data-say="${esc(t.s)}">🔊</button></h2>
  <div class="grid g2"><button class="opt ${S.wrong==="y"?"bad":""}" data-act="tf" data-v="1" style="border-color:var(--ok)"><span style="font-size:1.8em">✅</span> صحيح</button><button class="opt ${S.wrong==="n"?"bad":""}" data-act="tf" data-v="0" style="border-color:var(--bad)"><span style="font-size:1.8em">❌</span> خطأ</button></div></div>`;}
 else if(S.step==="match"){const L=l.match.map(p=>p[0]),R=S.order.map(i=>l.match[i][1]);body=`<h2 class="center" style="font-size:1.6em">صِلي كل عبارةٍ بما يناسبها 🔗</h2><p class="center muted" style="margin-bottom:14px">المسي عبارةً من اليمين ثم ما يناسبها من اليسار — ${S.pairs.length} من ${l.match.length}</p>
  <div class="matchgrid"><div class="grid">${L.map((t,i)=>`<button class="mcard ${S.pairs.includes(i)?"paired":S.sel===i?"sel":""} ${S.wrong==="L"+i?"bad":""}" data-act="mL" data-v="${i}" ${S.pairs.includes(i)?"disabled":""}>${t}</button>`).join("")}</div>
  <div class="grid">${R.map((t,k)=>{const i=S.order[k];return `<button class="mcard ${S.pairs.includes(i)?"paired":""} ${S.wrong==="R"+i?"bad":""}" data-act="mR" data-v="${i}" ${S.pairs.includes(i)?"disabled":""}>${t}</button>`;}).join("")}</div></div>`;}
 return `<div class="fade">${LessonTop(l)}<div class="row" style="justify-content:center;gap:6px;margin-bottom:14px">${["أقرأ","أستكشف","أختار","صح/خطأ","أصِل"].map((n,i)=>`<span class="badge" style="${i===si?"background:var(--teal);color:#fff":i<si?"background:var(--ok-soft);color:var(--ok)":""}">${i<si?"✓ ":""}${n}</span>`).join("")}</div>${body}</div>`;};

V.ldone=()=>{const l=S.lesson,mx=maxScore(l);const pct=Math.round(S.score/mx*100);return `<div class="fade narrow celebrate" style="margin:auto"><div class="big">${pct>=80?"🏆":pct>=50?"🌟":"💪"}</div>
 <h1 style="font-size:2.2em;color:var(--teal);margin-top:10px">${pct>=80?"ممتازة يا "+S.me.short+"!":pct>=50?"أحسنتِ يا "+S.me.short+"!":"محاولة رائعة يا "+S.me.short+"!"}</h1>
 <p style="font-size:1.3em;margin:8px 0 16px">أنهيتِ درس <b>${l.title}</b> وجمعتِ <b style="color:var(--gold-ink)">${S.score} ⭐</b> من ${mx}</p>
 <div class="card" style="text-align:start;margin-bottom:16px">${Bar(pct,"نتيجتي في هذا الدرس")}</div>
 <div class="grid g2"><button class="btn primary big" data-act="go" data-v="hub">دروسي 📚</button><button class="btn gold big" data-act="lesson" data-v="${l.id}">أعيد الدرس 🔁</button></div></div>`;};

V.activity=()=>{const a=ACTIVITIES[S.idx];return `<div class="fade narrow" style="margin:auto">${Top(`<button class="iconbtn" data-act="go" data-v="hub">✕</button>`,`<b style="font-size:1.3em">روتيني اليومي 🌼</b>`)}
 <div class="sched">${ACTIVITIES.map((x,i)=>`<div class="${i<S.idx?"done":i===S.idx?"now":"next"}">${x.emoji}</div>`).join("")}</div>
 <div class="card center"><div style="font-size:6em;line-height:1">${a.emoji}</div><h2 style="font-size:2em;margin:10px 0">${a.title}</h2><p style="font-size:1.25em">${a.say}</p><button class="speak" data-act="say" data-say="${esc(a.say)}" style="margin:12px 0 20px;font-size:1.1em">🔊 اسمعي</button>
 <p class="muted" style="margin-bottom:10px">هل فعلتِها؟</p><div class="grid g2"><button class="opt" data-act="did" data-v="alone" style="border-color:var(--ok)">💪 وحدي</button><button class="opt" data-act="did" data-v="help" style="border-color:var(--gold)">🤝 بمساعدة</button></div></div></div>`;};

V.comm=()=>`<div class="fade">${Top(`<button class="iconbtn" data-act="go" data-v="hub">✕</button>`,`<b style="font-size:1.3em">أريد أن أقول 🗣️</b>`)}
 <p class="center muted" style="margin-bottom:14px">المسي الصورة وسأقولها بصوتٍ عالٍ، وستصلُ إلى معلمتكِ</p>
 <div class="grid g3">${COMM.map((c,i)=>`<button class="tile" data-act="comm" data-v="${i}" style="min-height:130px"><span class="ic">${c.e}</span><span class="t">${c.t}</span></button>`).join("")}</div>
 ${(DB.said[S.me.id]||[]).filter(x=>x.reply).slice(-2).map(x=>`<div class="card" style="margin-top:14px;background:var(--gold-soft);border-color:var(--gold)"><b>قلتِ: ${x.e} ${esc(x.t)}</b><div>💬 ${esc(x.reply.by)}: <span style="font-family:var(--display);font-size:1.15em">${esc(x.reply.t)}</span> <button class="speak" data-act="say" data-say="${esc(x.reply.t)}">🔊</button></div></div>`).join("")}</div>`;

V.mystars=()=>{const me=S.me,done=DB.lessons[me.id]||{},rt=DB.ratings[me.id]||{};return `<div class="fade">${Top(`<button class="iconbtn" data-act="go" data-v="hub">✕</button>`,`<b style="font-size:1.3em">نجومي 🏆</b>`)}
 <div class="card center" style="background:var(--gold-soft);border-color:var(--gold)"><div style="font-size:4em">⭐</div><div style="font-family:var(--display);font-size:3em;font-weight:800;color:var(--gold-ink)">${DB.stars[me.id]||0}</div><p>نجمة جمعتِها بجهدكِ</p></div>
 <div class="grid g2" style="margin-top:14px">${LESSONS.map(l=>`<div class="card" style="border-color:${done[l.id]?"var(--ok)":"var(--line)"}"><div class="row between"><b>${l.icon} ${l.title}</b>${done[l.id]?`<span class="badge" style="background:var(--ok-soft);color:var(--ok)">✓ ${done[l.id].score}/${done[l.id].max}</span>`:`<span class="badge">لم يبدأ</span>`}</div>${rt[l.id]?`<div style="margin-top:8px">${Stars(rt[l.id].stars)}<div class="mini muted">من معلمتكِ: ${esc(rt[l.id].t)}</div></div>`:""}</div>`).join("")}</div>
 <div class="center" style="margin-top:16px"><button class="btn ghost" data-act="say" data-say="أنتِ بطلة يا ${me.short}، جمعتِ ${DB.stars[me.id]||0} نجمة">🔊 اسمعي تشجيعًا</button></div></div>`;};
</script>
<script>
/* ====================== شاشات الفريق ====================== */
const StaffTop=()=>Top(`${A11y()}<button class="btn ghost" data-act="leave" style="width:auto;min-height:44px;padding:6px 14px">خروج ✕</button>`,`<div class="brand">${Logo(38)} <span>${ROLE_ICON[S.role]} ${esc(S.staff.name)}</span><span class="badge">${ROLE_AR[S.role]}</span></div>`);
const StudentPicker=(list=STUDENTS)=>`<div class="grid g3" style="margin-bottom:16px">${list.map(s=>`<button class="stu ${S.cs==s.id?"on":""}" data-act="cs" data-v="${s.id}">${Avatar(s,52)}<span><b style="display:block;font-size:1.1em">${s.name}</b><span class="mini muted">${progressOf(s.id)}٪ · ⭐ ${DB.stars[s.id]||0}</span></span></button>`).join("")}</div>`;
const Tabs=(tabs)=>`<div class="tabs" role="tablist">${tabs.map(([k,t])=>`<button role="tab" class="${S.tab===k?"on":""}" data-act="tab" data-v="${k}">${t}</button>`).join("")}</div>`;
const NoteList=(arr,cls="")=>arr.length?`<div class="feed">${arr.slice().reverse().map(n=>`<div class="note ${cls}"><div class="row between mini"><b>${n.cat?`<span class="badge">${esc(n.cat)}</span> `:""}${esc(n.by||"")}${n.role?` · <span class="muted">${esc(n.role)}</span>`:""}</b><span class="muted">${esc(n.d||"")}</span></div><div>${esc(n.t)}</div></div>`).join("")}</div>`:`<p class="muted center" style="padding:14px">لا توجد ملاحظات بعد.</p>`;
const ProgressPanel=(sid)=>{const s=stu(sid),done=DB.lessons[sid]||{},rt=DB.ratings[sid]||{};return `<div class="grid g3" style="margin-bottom:14px"><div class="kpi"><div class="n">${progressOf(sid)}٪</div><div class="muted mini">إتقان الدروس</div></div><div class="kpi"><div class="n">${lessonsDone(sid)}/${LESSONS.length}</div><div class="muted mini">دروس مكتملة</div></div><div class="kpi"><div class="n">⭐ ${DB.stars[sid]||0}</div><div class="muted mini">النجوم المجموعة</div></div></div>
 ${Bar(progressOf(sid),"التقدّم العام")}
 <div class="grid" style="margin-top:14px">${LESSONS.map(l=>{const d=done[l.id],r=rt[l.id];return `<div class="soft row between"><div class="row"><span style="font-size:1.6em">${l.icon}</span><div><b>${l.title}</b><div class="mini muted">${d?`أنهتها الطالبة: ${d.score}/${d.max}`:"لم تبدأ بعد"}</div></div></div><div style="text-align:end">${r?Stars(r.stars):`<span class="muted mini">بلا تقييم</span>`}${r&&r.t?`<div class="mini muted">${esc(r.t)}</div>`:""}</div></div>`;}).join("")}</div>
 <h3 style="margin:18px 0 8px">😊 مشاعرها الأخيرة</h3><div class="row">${(DB.moods[sid]||[]).slice(-6).map(m=>`<span class="badge">${m.e} ${m.t} · ${m.d}</span>`).join("")||'<span class="muted">لم تسجّل بعد</span>'}</div>`;};

/* المعلمة */
V.t_home=()=>{const sid=S.cs,s=stu(sid);let panel="";
 if(S.tab==="progress")panel=ProgressPanel(sid);
 else if(S.tab==="rate")panel=`<p class="muted" style="margin-bottom:12px">قيّمي أداء ${s.short} في كل درسٍ بالنجوم واكتبي تعليقًا قصيرًا تراه الطالبة وولي أمرها.</p><div class="grid">${LESSONS.map(l=>{const r=(DB.ratings[sid]||{})[l.id]||{stars:0,t:""};return `<div class="card" style="padding:14px"><div class="row between"><b>${l.icon} ${l.title}</b>${Stars(r.stars,{ro:false,act:"rate:"+l.id})}</div><div class="row" style="margin-top:8px"><input type="text" id="rt-${l.id}" value="${esc(r.t)}" placeholder="تعليق المعلمة…" style="flex:1"><button class="btn primary" data-act="ratesave" data-v="${l.id}" style="min-height:48px">حفظ</button></div></div>`;}).join("")}</div>`;
 else if(S.tab==="notes")panel=`<div class="card" style="margin-bottom:14px"><h3>✍️ ملاحظة متابعة</h3><div class="row" style="margin-top:8px"><select id="ncat" style="width:auto">${NOTE_CATS.map(c=>`<option>${c}</option>`).join("")}</select><input type="text" id="ninp" placeholder="اكتبي ملاحظتكِ عن ${s.short}…" style="flex:1"></div><button class="btn primary" data-act="addnote" style="margin-top:10px">إضافة الملاحظة</button></div>
  <h3 style="margin-bottom:8px">ملاحظات الفريق</h3>${NoteList(DB.notes[sid]||[])}
  <h3 style="margin:18px 0 8px">🏠 ملاحظات ولي الأمر</h3>${NoteList(DB.parentNotes[sid]||[],"gold")}`;
 else if(S.tab==="goals")panel=`<div class="card" style="margin-bottom:14px"><h3>🎯 هدف جديد</h3><div class="row" style="margin-top:8px"><input type="text" id="ginp" placeholder="مثال: إتمام درس الإحرام هذا الأسبوع" style="flex:1"><button class="btn primary" data-act="addgoal">إضافة</button></div></div><div class="grid">${(DB.goals[sid]||[]).map((g,i)=>`<div class="soft row between"><b>🎯 ${esc(g.t)}</b><span class="badge">${esc(g.d)}</span></div>`).join("")}</div>`;
 else if(S.tab==="msg")panel=`<div class="card"><h3>💌 رسالة تشجيع تسمعها ${s.short} عند دخولها</h3><p class="muted mini" style="margin:6px 0 10px">الرسالة الحالية: <b>${esc((DB.messages[sid]||{}).text||"—")}</b></p><div class="grid g3">${["أنا فخورةٌ بكِ!","أحسنتِ، استمرّي يا بطلة!","نحبكِ ونثق بكِ 💚"].map(t=>`<button class="pill" data-act="msg" data-v="${esc(t)}">${t}</button>`).join("")}</div><div class="row" style="margin-top:10px"><input type="text" id="minp" placeholder="أو اكتبي رسالتكِ…" style="flex:1"><button class="btn primary" data-act="msgcustom">إرسال</button></div></div>
  <h3 style="margin:18px 0 8px">🗣️ ما قالته ${s.short} عبر لوحة التواصل</h3>${SaidList(sid,false)}
  <div style="margin-top:16px"><button class="btn gold" data-act="preview">👀 معاينة واجهة الطالبة</button></div>`;
 return `<div class="fade">${StaffTop()}<h2 style="margin-bottom:10px">طالباتي</h2>${StudentPicker()}
 <div class="card" style="padding:18px"><div class="row" style="margin-bottom:12px">${Avatar(s,56)}<h2 style="font-size:1.5em">${s.name}</h2></div>
 ${Tabs([["progress","📈 التقدّم"],["rate","⭐ التقييم بالنجوم"],["notes","📝 الملاحظات"],["goals","🎯 الأهداف"],["msg","💌 رسالة ومعاينة"]])}${panel}</div>${Footer()}</div>`;};

const SaidList=(sid,canReply)=>{const arr=DB.said[sid]||[];return arr.length?`<div class="feed">${arr.slice().reverse().map((x,ri)=>{const i=arr.length-1-ri;return `<div class="msg"><div class="who"><span style="font-size:1.4em">${x.e}</span><b>${esc(x.t)}</b><span class="muted mini">${x.d}</span></div>${x.reply?`<div class="note ok" style="margin-top:4px">💬 <b>${esc(x.reply.by)}</b>: ${esc(x.reply.t)}</div>`:canReply?`<div class="row"><input type="text" id="rp-${i}" placeholder="ردّ المديرة على الطالبة…" style="flex:1"><button class="btn primary" data-act="reply" data-v="${i}" style="min-height:44px">ردّ</button></div>`:""}</div>`;}).join("")}</div>`:`<p class="muted">لم تستخدم لوحة التواصل بعد.</p>`;};

/* ولي الأمر */
V.p_home=()=>{const sid=S.cs,s=stu(sid);let panel="";
 if(S.tab==="progress")panel=ProgressPanel(sid)+`<h3 style="margin:18px 0 8px">🎯 أهداف هذا الفصل</h3><div class="grid">${(DB.goals[sid]||[]).map(g=>`<div class="soft row between"><b>${esc(g.t)}</b><span class="badge">${esc(g.d)}</span></div>`).join("")}</div>`;
 else if(S.tab==="home")panel=`<p class="muted" style="margin-bottom:12px">سجّل ما أنجزته ${s.short} في المنزل اليوم — تراه المعلمة والرائدة الصحية.</p><div class="grid">${ACTIVITIES.map(a=>{const v=(DB.home[sid]||{})[a.id];return `<div class="soft row between"><div class="row"><span style="font-size:1.8em">${a.emoji}</span><b>${a.title}</b></div><div class="row"><button class="pill ${v==="alone"?"on":""}" data-act="home" data-v="${a.id}:alone">💪 وحدها</button><button class="pill ${v==="help"?"on":""}" data-act="home" data-v="${a.id}:help">🤝 بمساعدة</button><button class="pill ${v==="no"?"on":""}" data-act="home" data-v="${a.id}:no">⏳ لم تفعل</button></div></div>`;}).join("")}</div>`;
 else if(S.tab==="notes")panel=`<div class="card" style="margin-bottom:14px"><h3>✍️ ملاحظة من المنزل</h3><textarea id="pinp" rows="3" placeholder="اكتب ما لاحظته على ${s.short} في المنزل، أو سؤالًا للمعلمة…" style="margin-top:8px"></textarea><button class="btn primary" data-act="addparent" style="margin-top:10px">إرسال للمدرسة</button></div><h3 style="margin-bottom:8px">ملاحظاتي السابقة</h3>${NoteList(DB.parentNotes[sid]||[],"gold")}
  <h3 style="margin:18px 0 8px">💬 تعليقات الفريق على ${s.short}</h3>${NoteList([...(DB.notes[sid]||[]),...(DB.comments[sid]||[])])}`;
 else if(S.tab==="health")panel=`<h3 style="margin-bottom:8px">🩺 توجيهات صحية خاصة بـ${s.short}</h3>${NoteList(DB.health[sid]||[],"sky")}<h3 style="margin:18px 0 8px">📰 نشرات الرائدة الصحية</h3>${Bulletins()}`;
 return `<div class="fade">${StaffTop()}<div class="card"><div class="row" style="margin-bottom:12px">${Avatar(s,64)}<div><h2 style="font-size:1.5em">${s.name}</h2><span class="muted">ابنتكم الغالية — نتابع معكم خطوةً بخطوة</span></div></div>
 ${Tabs([["progress","📈 تقدّمها"],["home","🏠 إنجازات المنزل"],["notes","✍️ ملاحظاتي"],["health","🩺 الصحة والنشرات"]])}${panel}</div>${Footer()}</div>`;};

const Bulletins=(edit=false)=>`<div class="grid g2">${DB.bulletins.map(b=>`<article class="bulletin" style="background:${b.bg}"><div class="row between"><span class="badge" style="background:rgba(255,255,255,.7)">${esc(b.cat)}</span><span style="font-size:2em">${b.icon}</span></div><h3>${esc(b.title)}</h3><p>${esc(b.body)}</p><div class="row between mini" style="opacity:.75"><span>${esc(b.by)}</span>${edit?`<button class="badge" data-act="delb" data-v="${b.id}">🗑 حذف</button>`:`<button class="badge" data-act="say" data-say="${esc(b.title)}. ${esc(b.body)}">🔊</button>`}</div></article>`).join("")}</div>`;

/* الرائدة الصحية */
V.h_home=()=>{const sid=S.cs,s=stu(sid);let panel="";
 if(S.tab==="bulletins")panel=`<div class="card" style="margin-bottom:14px"><h3>📰 نشرة جديدة للأسر</h3><div class="row" style="margin-top:8px"><select id="bcat" style="width:auto">${HEALTH_CATS.map(c=>`<option>${c}</option>`).join("")}</select><input type="text" id="bicon" placeholder="رمز (مثل 🍎)" style="width:120px"><input type="text" id="btitle" placeholder="عنوان النشرة" style="flex:1"></div><textarea id="bbody" rows="3" placeholder="نصّ النشرة — نصيحة عملية قصيرة للتعامل مع الإعاقة أو الروتين اليومي…" style="margin-top:8px"></textarea><button class="btn primary" data-act="addb" style="margin-top:10px">نشر للأسر</button></div>${Bulletins(true)}`;
 else panel=`${StudentPicker()}<div class="card" style="margin-bottom:14px"><h3>🩺 توجيه صحي لـ${s.short}</h3><div class="row" style="margin-top:8px"><select id="hcat" style="width:auto">${HEALTH_CATS.map(c=>`<option>${c}</option>`).join("")}</select><input type="text" id="hinp" placeholder="اكتبي التوجيه…" style="flex:1"></div><button class="btn primary" data-act="addhealth" style="margin-top:10px">حفظ</button></div>${NoteList(DB.health[sid]||[],"sky")}
  <h3 style="margin:18px 0 8px">🏠 إنجازات ${s.short} في المنزل</h3><div class="row">${ACTIVITIES.map(a=>{const v=(DB.home[sid]||{})[a.id];return `<span class="badge">${a.emoji} ${a.title}: ${v==="alone"?"💪 وحدها":v==="help"?"🤝 بمساعدة":"⏳"}</span>`;}).join("")}</div>`;
 return `<div class="fade">${StaffTop()}<h2 style="margin-bottom:10px">الصحة والرعاية 🩺</h2>${Tabs([["students","👧 متابعة الطالبات"],["bulletins","📰 النشرات الصحية"]])}${panel}${Footer()}</div>`;};

/* المرشدة الطلابية */
V.c_home=()=>{const sid=S.cs,s=stu(sid);return `<div class="fade">${StaffTop()}<h2 style="margin-bottom:10px">الإرشاد الطلابي 💬</h2>${StudentPicker()}
 <div class="grid g2"><div class="card"><h3>✍️ ملاحظة إرشادية عن ${s.short}</h3><div class="row" style="margin-top:8px"><select id="ncat" style="width:auto">${NOTE_CATS.map(c=>`<option>${c}</option>`).join("")}</select></div><textarea id="ninp" rows="3" placeholder="الملاحظة السلوكية أو الاجتماعية أو الانفعالية…" style="margin-top:8px"></textarea><button class="btn primary" data-act="addnote" style="margin-top:10px">حفظ الملاحظة</button>
  <h3 style="margin:18px 0 8px">السجل</h3>${NoteList(DB.notes[sid]||[],"lav")}</div>
 <div class="card"><h3>😊 مشاعرها المسجّلة</h3><div class="row" style="margin:8px 0 14px">${(DB.moods[sid]||[]).slice(-8).map(m=>`<span class="badge">${m.e} ${m.t} · ${m.d}</span>`).join("")||'<span class="muted">لا تسجيلات بعد</span>'}</div><h3>🗣️ ما تقوله عبر لوحة التواصل</h3><div style="margin-top:8px">${SaidList(sid,false)}</div>
  <h3 style="margin:18px 0 8px">💡 نصائح سريعة للفريق</h3><div class="feed">${["ابدئي كل جلسة بسؤال المشاعر — الوجوه الأربعة في المنصة تسهّل التعبير.","استخدمي «الحِلم والأناة» كقصة يومية: أهدأ، أتنفّس، أفكّر ثم أتصرّف.","عزّزي فورًا وبالاسم: «أحسنتِ يا شهد» أقوى من «أحسنتِ» وحدها."].map(t=>`<div class="note lav">${t}</div>`).join("")}</div></div></div>${Footer()}</div>`;};

/* المديرة */
V.pr_home=()=>{const avg=Math.round(STUDENTS.reduce((a,s)=>a+progressOf(s.id),0)/STUDENTS.length);const totalNotes=STUDENTS.reduce((a,s)=>a+(DB.notes[s.id]||[]).length+(DB.parentNotes[s.id]||[]).length,0);const sid=S.cs,s=stu(sid),ev=(DB.principalEval[sid]||{stars:0,t:""});
 return `<div class="fade">${StaffTop()}<h2 style="margin-bottom:10px">لوحة المديرة 🏫</h2>
 <div class="grid g3" style="margin-bottom:16px"><div class="kpi"><div class="n">${avg}٪</div><div class="muted mini">متوسط إتقان الدروس</div></div><div class="kpi"><div class="n">${STUDENTS.reduce((a,x)=>a+(DB.stars[x.id]||0),0)}</div><div class="muted mini">إجمالي النجوم</div></div><div class="kpi"><div class="n">${totalNotes}</div><div class="muted mini">ملاحظات الفريق والأسر</div></div><div class="kpi"><div class="n">${DB.bulletins.length}</div><div class="muted mini">نشرات صحية منشورة</div></div></div>
 <div class="card" style="margin-bottom:16px"><h3 style="margin-bottom:10px">📊 تقدّم الطالبات</h3><div class="grid">${STUDENTS.map(x=>`<div class="row" style="gap:14px">${Avatar(x,44)}<div style="flex:1">${Bar(progressOf(x.id),x.name)}</div><span class="badge">⭐ ${DB.stars[x.id]||0}</span>${Stars((DB.principalEval[x.id]||{}).stars||0)}</div>`).join("")}</div></div>
 ${StudentPicker()}
 <div class="grid g2"><div class="card"><h3>🏅 تقييم المديرة لـ${s.short}</h3><div style="margin:10px 0">${Stars(ev.stars,{ro:false,act:"peval",size:"1.8em"})}</div><input type="text" id="pevt" value="${esc(ev.t)}" placeholder="ملاحظة التقييم…"><button class="btn primary" data-act="pevalsave" style="margin-top:10px">حفظ التقييم</button>
  <h3 style="margin:18px 0 8px">💬 تعليق للطالبة وأسرتها</h3><textarea id="cinp" rows="2" placeholder="كلمة تشجيع أو ملاحظة تظهر لولي الأمر والمعلمة…"></textarea><button class="btn gold" data-act="addcomment" style="margin-top:10px">إضافة التعليق</button><div style="margin-top:12px">${NoteList(DB.comments[sid]||[],"ok")}</div></div>
 <div class="card"><h3>🗣️ كلام ${s.short} عبر لوحة التواصل — علّقي عليه</h3><div style="margin-top:8px">${SaidList(sid,true)}</div>
  <h3 style="margin:18px 0 8px">📝 آخر ملاحظات الفريق والأسرة</h3>${NoteList([...(DB.notes[sid]||[]),...(DB.parentNotes[sid]||[]),...(DB.health[sid]||[]).map(h=>({...h,role:"الرائدة الصحية"}))].slice(-5))}
  <h3 style="margin:18px 0 8px">⭐ تقييمات المعلمة</h3><div class="grid">${LESSONS.filter(l=>(DB.ratings[sid]||{})[l.id]).map(l=>{const r=DB.ratings[sid][l.id];return `<div class="soft row between"><b>${l.icon} ${l.title}</b><div>${Stars(r.stars)}<div class="mini muted">${esc(r.by)}: ${esc(r.t)}</div></div></div>`;}).join("")||'<p class="muted">لا تقييمات بعد.</p>'}</div></div></div>${Footer()}</div>`;};

/* ====================== المعالجة ====================== */
const val=id=>{const el=document.getElementById(id);return el?el.value.trim():"";};
const push=(map,sid,obj)=>{map[sid]=map[sid]||[];map[sid].push(obj);save();};
const finishStep=(next)=>{setTimeout(()=>{S.step=next;S.wrong=null;S.qi=0;S.ti=0;S.sel=null;S.pairs=[];if(next==="mcq")S.order=rnd(S.lesson.mcq[0].opts.map((_,i)=>i));if(next==="match")S.order=rnd(S.lesson.match.map((_,i)=>i));render();},420);};
const award=(n=1)=>{DB.stars[S.me.id]=(DB.stars[S.me.id]||0)+n;S.score+=n;save();};

document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const act=b.dataset.act,v=b.dataset.v;
 switch(act){
  case "go":go(v);break;
  case "say":speak(b.dataset.say);break;
  case "fs":UI.fs=parseFloat(v);document.documentElement.style.setProperty("--fs",UI.fs);saveUI();render();break;
  case "hc":UI.hc=!UI.hc;document.documentElement.toggleAttribute("data-contrast",UI.hc);if(UI.hc)document.documentElement.setAttribute("data-contrast","high");saveUI();render();break;
  case "snd":UI.sound=!UI.sound;saveUI();render();break;
  case "role":S.role=v;S.tab=v==="health"?"students":"progress";S.cs=1;if(v==="student")go("login");else if(v==="teacher"||v==="parent")go("pickuser");else if(v==="counselor"){S.staff=COUNSELOR;go("c_home");}else if(v==="health"){S.staff=HEALTH;go("h_home");}else{S.staff=PRINCIPAL;go("pr_home");}break;
  case "pickstaff":{const u=(S.role==="teacher"?TEACHERS:PARENTS).find(x=>x.id===v);S.staff=u;if(u.childId)S.cs=u.childId;go(S.role==="teacher"?"t_home":"p_home");break;}
  case "leave":S.role=null;S.staff=null;S.preview=false;go("role");break;
  case "login":S.me=stu(v);S.mood=null;S.idx=0;speak(`أهلًا بكِ يا ${S.me.short}`);tone("tap");go("mood");break;
  case "exit":try{speechSynthesis.cancel();}catch(e){}if(S.preview){S.preview=false;S.me=null;go(S.previewRet);break;}S.me=null;go("login");break;
  case "mood":{const m=MOODS[v];S.mood=m;push(DB.moods,S.me.id,{t:m.t,e:m.e,d:today()});speak(`أنتِ ${m.t} اليوم. أهلًا بكِ يا ${S.me.short}`);tone("tap");go("hub");break;}
  case "lesson":S.lesson=lessonOf(v);S.step="read";S.qi=0;S.ti=0;S.said=new Set();S.sel=null;S.pairs=[];S.score=0;speak(S.lesson.title);go("lesson");break;
  case "step":S.step=v;S.wrong=null;if(v==="mcq")S.order=rnd(S.lesson.mcq[0].opts.map((_,i)=>i));if(v==="explore")speak("المسي الصورة لتسمعي");if(v==="mcq")speak(S.lesson.mcq[0].q);render();break;
  case "picto":{const p=S.lesson.pictos[v];S.said.add(+v);speak(p.s);tone("tap");render();break;}
  case "mcq":{const q=S.lesson.mcq[S.qi],o=q.opts[v];if(o.ok){award();tone("ok");S.wrong=null;b.classList.add("ok");if(S.qi+1<S.lesson.mcq.length){setTimeout(()=>{S.qi++;S.order=rnd(S.lesson.mcq[S.qi].opts.map((_,i)=>i));render();speak(S.lesson.mcq[S.qi].q);},420);}else{speak("أحسنتِ! الآن صحيح أم خطأ");finishStep("tf");}}else{S.wrong=+v;tone("bad");speak("حاولي مرةً أخرى");render();setTimeout(()=>{S.wrong=null;render();},400);}break;}
  case "tf":{const t=S.lesson.tf[S.ti],ans=v==="1";if(ans===t.ans){award();tone("ok");b.classList.add("ok");if(S.ti+1<S.lesson.tf.length){setTimeout(()=>{S.ti++;render();speak(S.lesson.tf[S.ti].s);},420);}else{speak("ممتازة! الآن صِلي كل عبارةٍ بما يناسبها");finishStep("match");}}else{S.wrong=ans?"y":"n";tone("bad");speak("حاولي مرةً أخرى");render();setTimeout(()=>{S.wrong=null;render();},400);}break;}
  case "mL":S.sel=+v;tone("tap");speak(S.lesson.match[v][0]);render();break;
  case "mR":{if(S.sel===null){speak("اختاري عبارةً من اليمين أولًا");break;}if(S.sel===+v){S.pairs.push(+v);award();tone("ok");S.sel=null;render();if(S.pairs.length===S.lesson.match.length){DB.lessons[S.me.id]=DB.lessons[S.me.id]||{};const prev=DB.lessons[S.me.id][S.lesson.id];DB.lessons[S.me.id][S.lesson.id]={score:Math.max(S.score,prev?prev.score:0),max:maxScore(S.lesson)};save();setTimeout(()=>{tone("win");confetti();speak(`ممتازة يا ${S.me.short}! أنهيتِ درس ${S.lesson.title}`);go("ldone");},500);}}else{S.wrong="R"+v;tone("bad");render();setTimeout(()=>{S.wrong=null;render();},400);}break;}
  case "did":{award(v==="alone"?2:1);tone("ok");DB.home[S.me.id]=DB.home[S.me.id]||{};DB.home[S.me.id][ACTIVITIES[S.idx].id]=v;save();speak(v==="alone"?"رائع! فعلتِها وحدكِ":"أحسنتِ! المساعدة شيءٌ جميل");if(S.idx+1<ACTIVITIES.length){setTimeout(()=>{S.idx++;render();speak(ACTIVITIES[S.idx].say);},700);}else{setTimeout(()=>{confetti();tone("win");S.idx=0;toast("أنهيتِ روتينكِ اليومي 🌼");go("hub");},700);}break;}
  case "comm":{const c=COMM[v];speak(c.t);tone("tap");push(DB.said,S.me.id,{t:c.t,e:c.e,d:today()});toast("وصلت رسالتكِ إلى معلمتكِ 💌");break;}
  case "cs":S.cs=+v;render();break;
  case "tab":S.tab=v;render();break;
  case "ratesave":{DB.ratings[S.cs]=DB.ratings[S.cs]||{};const r=DB.ratings[S.cs][v]||{stars:0};DB.ratings[S.cs][v]={stars:r.stars,t:val("rt-"+v),by:S.staff.name};save();toast("تم حفظ التقييم ⭐");render();break;}
  case "addnote":{const t=val("ninp");if(!t){toast("اكتبي الملاحظة أولًا");break;}push(DB.notes,S.cs,{cat:val("ncat"),t,by:S.staff.name,role:ROLE_AR[S.role],d:today()});toast("أُضيفت الملاحظة");render();break;}
  case "addgoal":{const t=val("ginp");if(!t)break;push(DB.goals,S.cs,{t,d:"هدف المعلمة"});render();break;}
  case "msg":DB.messages[S.cs]={text:v,by:S.staff.name};save();toast("أُرسلت الرسالة 💌");render();break;
  case "msgcustom":{const t=val("minp");if(!t)break;DB.messages[S.cs]={text:t,by:S.staff.name};save();toast("أُرسلت الرسالة 💌");render();break;}
  case "preview":S.preview=true;S.previewRet="t_home";S.me=stu(S.cs);S.mood=null;go("hub");break;
  case "home":{const [aid,lvl]=v.split(":");DB.home[S.cs]=DB.home[S.cs]||{};DB.home[S.cs][aid]=lvl;save();render();break;}
  case "addparent":{const t=val("pinp");if(!t){toast("اكتب ملاحظتك أولًا");break;}push(DB.parentNotes,S.cs,{t,by:S.staff.name,d:today()});toast("أُرسلت للمدرسة ✅");render();break;}
  case "addhealth":{const t=val("hinp");if(!t)break;push(DB.health,S.cs,{cat:val("hcat"),t,d:today()});toast("حُفظ التوجيه");render();break;}
  case "addb":{const title=val("btitle"),body=val("bbody");if(!title||!body){toast("العنوان والنص مطلوبان");break;}const bgs=["#DDEFEC","#FBEEDA","#FBE3EA","#E1ECF9","#EDE6F8","#DDF1E6"];DB.bulletins.push({id:"b"+Date.now(),cat:val("bcat"),icon:val("bicon")||"💡",title,body,by:S.staff.name,bg:bgs[DB.bulletins.length%bgs.length]});save();toast("نُشرت النشرة 📰");render();break;}
  case "delb":DB.bulletins=DB.bulletins.filter(x=>x.id!==v);save();render();break;
  case "pevalsave":{const cur=DB.principalEval[S.cs]||{stars:0};DB.principalEval[S.cs]={stars:cur.stars,t:val("pevt")};save();toast("حُفظ التقييم 🏅");render();break;}
  case "addcomment":{const t=val("cinp");if(!t)break;push(DB.comments,S.cs,{by:S.staff.name,role:ROLE_AR[S.role],t,d:today()});toast("أُضيف التعليق");render();break;}
  case "reply":{const t=val("rp-"+v);if(!t)break;DB.said[S.cs][v].reply={by:S.staff.name,t};save();toast("أُرسل الردّ للطالبة 💬");render();break;}
  default:if(act.startsWith("rate:")){const lid=act.slice(5);DB.ratings[S.cs]=DB.ratings[S.cs]||{};const r=DB.ratings[S.cs][lid]||{t:""};DB.ratings[S.cs][lid]={stars:+v,t:document.getElementById("rt-"+lid)?.value.trim()??r.t,by:S.staff.name};save();tone("tap");render();}
   else if(act==="peval"){const cur=DB.principalEval[S.cs]||{t:""};DB.principalEval[S.cs]={stars:+v,t:document.getElementById("pevt")?.value.trim()??cur.t};save();tone("tap");render();}
 }});

function render(){const app=document.getElementById("app");const fn=V[S.screen]||V.landing;app.innerHTML=fn();}
render();
</script>
</body></html>
